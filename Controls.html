<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Controls MC Guide</title>
</head>

<body>
touch-action: manipulation;
    <script src="mcd.js"></script>

    <script>
        MCD.load("mcds/Controls.mcd");      
    </script>
    
    
<script>
(function () {
    let lastTouchEnd = 0;

    // Block Safari gesture-based zoom
    document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
    }, { passive: false });

    document.addEventListener("gestureend", function (event) {
        event.preventDefault();
    }, { passive: false });

    // Block pinch zoom and other multi-finger zoom gestures
    document.addEventListener("touchstart", function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    document.addEventListener("touchmove", function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    // Block double-tap zoom
    document.addEventListener("touchend", function (event) {
        const now = Date.now();

        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }

        lastTouchEnd = now;
    }, { passive: false });

    // Prevent Ctrl/Command + wheel zoom where supported
    document.addEventListener("wheel", function (event) {
        if (event.ctrlKey) {
            event.preventDefault();
        }
    }, { passive: false });

    // Prevent keyboard zoom shortcuts where supported
    document.addEventListener("keydown", function (event) {
        if (
            (event.ctrlKey || event.metaKey) &&
            (
                event.key === "+" ||
                event.key === "-" ||
                event.key === "=" ||
                event.key === "0"
            )
        ) {
            event.preventDefault();
        }
    });
})();
</script>
</body>
</html>
