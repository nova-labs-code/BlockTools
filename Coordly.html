<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">

<title>Coordly</title>

<style>
* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    background: #0d1117;
    overflow-x: hidden;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background: #0d1117;
    color: #f0f3f6;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;

    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);

    touch-action: manipulation;

    /*
        Safari visual viewport compensation.
        These variables are updated by JavaScript.
    */
    --visual-top: 0px;
    --visual-bottom: 0px;
}

.container {
    width: min(100%, 1000px);
    margin: 0 auto;

    padding: 24px 16px 40px;

    /*
        Extra room is automatically added when Safari's
        browser UI covers the visual viewport.
    */
    padding-top: calc(
        24px + var(--visual-top)
    );

    padding-bottom: calc(
        40px + var(--visual-bottom)
    );
}

/* Header */

.header {
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 5px;

    font-size: 32px;
    line-height: 1.1;

    color: #ffffff;
}

.header p {
    margin: 0;

    color: #8b949e;
    font-size: 15px;
    line-height: 1.5;
}

/* Panels */

.panel {
    width: 100%;

    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;

    padding: 18px;
    margin-bottom: 14px;

    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
}

.panel h2 {
    margin: 0 0 14px;

    font-size: 21px;
    line-height: 1.2;

    color: #ffffff;
}

.panel-description {
    margin: -7px 0 15px;

    color: #8b949e;
    font-size: 13px;
    line-height: 1.4;
}

/* Forms */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.field {
    min-width: 0;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    display: block;

    margin-bottom: 6px;

    color: #c9d1d9;
    font-size: 13px;
    font-weight: 600;
}

input,
select {
    width: 100%;

    min-height: 42px;

    padding: 10px 12px;

    border: 1px solid #30363d;
    border-radius: 9px;

    background: #0d1117;
    color: #f0f3f6;

    outline: none;

    font: inherit;
    font-size: 14px;
}

input:focus,
select:focus {
    border-color: #58a6ff;
    box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.12);
}

input::placeholder {
    color: #6e7681;
}

/* Buttons */

button {
    min-height: 42px;

    padding: 10px 14px;

    border: 1px solid #30363d;
    border-radius: 9px;

    background: #21262d;
    color: #f0f3f6;

    font: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #30363d;
}

button:active {
    transform: translateY(1px);
}

button.primary {
    background: #238636;
    border-color: #2ea043;
}

button.primary:hover {
    background: #2ea043;
}

button.danger {
    background: #da3633;
    border-color: #f85149;
}

button.danger:hover {
    background: #f85149;
}

button.small {
    min-height: 36px;
    padding: 8px 11px;
    font-size: 13px;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* World */

.world-actions {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;

    margin-top: 13px;
}

.world-info {
    margin-top: 15px;

    border-top: 1px solid #30363d;
    padding-top: 12px;
}

.world-info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;

    padding: 5px 0;

    font-size: 14px;
}

.world-info-label {
    color: #8b949e;
}

.world-info-value {
    color: #f0f3f6;
    font-weight: 600;
    text-align: right;

    overflow-wrap: anywhere;
}

/* Add location */

.add-location-button {
    margin-top: 13px;
    width: 100%;
}

/* Saved controls */

.controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 170px 170px;
    gap: 8px;

    margin-bottom: 12px;
}

.controls input,
.controls select {
    min-width: 0;
}

.saved-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    margin-bottom: 13px;
}

.location-count {
    margin-left: auto;

    display: flex;
    align-items: center;

    color: #8b949e;
    font-size: 13px;
}

/* Locations */

.locations {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.empty-state {
    padding: 25px 12px;

    border: 1px dashed #30363d;
    border-radius: 10px;

    text-align: center;

    color: #8b949e;
    font-size: 14px;
}

.location-card {
    background: #0d1117;

    border: 1px solid #30363d;
    border-radius: 11px;

    padding: 14px;

    /*
        Keeps cards from being placed directly against
        the browser's visible viewport edge.
    */
    scroll-margin-top: 90px;
    scroll-margin-bottom: 110px;
}

.location-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;
}

.location-name {
    min-width: 0;

    color: #ffffff;

    font-size: 17px;
    font-weight: 700;

    overflow-wrap: anywhere;
}

.location-dimension {
    flex-shrink: 0;

    padding: 4px 8px;

    border-radius: 999px;

    background: #21262d;
    color: #8b949e;

    font-size: 11px;
    font-weight: 700;
}

.coordinates {
    margin-top: 8px;

    color: #58a6ff;

    font-family: monospace;
    font-size: 14px;

    white-space: nowrap;
    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

.location-category {
    margin-top: 8px;

    color: #8b949e;
    font-size: 12px;
}

.location-card .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;

    margin-top: 12px;
}

.location-card .actions button {
    flex: 1 1 auto;
}

/* Modal */

.modal-backdrop {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 18px;

    padding-top: calc(
        18px + env(safe-area-inset-top)
    );

    padding-bottom: calc(
        18px + env(safe-area-inset-bottom)
    );

    background: rgba(0, 0, 0, 0.72);

    overscroll-behavior: contain;
}

.modal-backdrop.open {
    display: flex;
}

.modal {
    width: min(100%, 470px);

    max-height: calc(100dvh - 36px);

    overflow-y: auto;

    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;

    padding: 18px;

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.modal h3 {
    margin: 0 0 9px;

    font-size: 21px;
}

.modal-message {
    margin-bottom: 15px;

    color: #8b949e;
    font-size: 14px;
    line-height: 1.5;
}

.modal-fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;

    margin-top: 17px;
}

/* Toast */

.toast {
    position: fixed;

    z-index: 2000;

    left: 50%;

    bottom: calc(
        18px +
        env(safe-area-inset-bottom) +
        var(--visual-bottom)
    );

    transform: translateX(-50%) translateY(20px);

    width: max-content;
    max-width: calc(100vw - 30px);

    padding: 11px 15px;

    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 9px;

    color: #f0f3f6;

    font-size: 13px;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* Mobile */

@media (max-width: 700px) {

    .container {
        width: 100%;
        max-width: none;

        padding-top: calc(
            18px + var(--visual-top)
        );

        padding-right: 10px;

        padding-bottom: calc(
            30px + var(--visual-bottom)
        );

        padding-left: 10px;
    }

    .header {
        margin-bottom: 15px;
    }

    .header h1 {
        font-size: 28px;
    }

    .header p {
        font-size: 14px;
    }

    .panel {
        padding: 14px;
        margin-bottom: 12px;

        border-radius: 12px;
    }

    .panel h2 {
        font-size: 20px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .field.full {
        grid-column: auto;
    }

    .world-actions {
        grid-template-columns: 1fr;
    }

    .world-actions button {
        width: 100%;
    }

    .world-info-row {
        flex-direction: column;
        gap: 3px;
    }

    .world-info-value {
        width: 100%;
        text-align: left;
    }

    .controls {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .saved-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .saved-actions button {
        width: 100%;
    }

    .location-count {
        grid-column: 1 / -1;

        margin-left: 0;

        justify-content: center;
    }

    .location-card {
        padding: 12px;
    }

    .location-top {
        display: block;
    }

    .location-dimension {
        display: inline-block;
        margin-top: 7px;
    }

    .location-name {
        font-size: 17px;
    }

    .coordinates {
        max-width: 100%;
    }

    /*
        Three buttons now fit cleanly on mobile.
    */
    .location-card .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .location-card .actions button {
        width: 100%;
    }

    .modal {
        max-height: calc(100dvh - 36px);
    }
}

@media (max-width: 380px) {

    .container {
        padding-right: 8px;
        padding-left: 8px;
    }

    .panel {
        padding: 12px;
    }

    .saved-actions {
        grid-template-columns: 1fr;
    }

    .location-card .actions {
        grid-template-columns: 1fr;
    }

    .modal-actions {
        grid-template-columns: 1fr;
    }

    button {
        padding-left: 11px;
        padding-right: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>Coordly</h1>
        <p>Keep track of your Minecraft locations.</p>
    </header>


    <!-- WORLD -->

    <section class="panel">

        <h2>World</h2>

        <div class="field">

            <label for="worldSelect">
                Current World
            </label>

            <select id="worldSelect"></select>

        </div>


        <div class="world-info">

            <div class="world-info-row">
                <span class="world-info-label">
                    Name
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldName"
                >
                    World 1
                </span>
            </div>


            <div class="world-info-row">
                <span class="world-info-label">
                    Seed
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldSeed"
                >
                    Not set
                </span>
            </div>


            <div class="world-info-row">
                <span class="world-info-label">
                    Locations
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldLocationCount"
                >
                    0
                </span>
            </div>

        </div>


        <div class="world-actions">

            <button
                id="newWorld"
                class="primary"
            >
                New World
            </button>

            <button id="editWorld">
                Rename / Edit
            </button>

            <button
                id="deleteWorld"
                class="danger"
            >
                Delete World
            </button>

            <button id="copyWorld">
                Copy World
            </button>

        </div>

    </section>


    <!-- ADD LOCATION -->

    <section class="panel">

        <h2>Add Location</h2>

        <div class="form-grid">

            <div class="field full">

                <label for="locationName">
                    Name
                </label>

                <input
                    id="locationName"
                    type="text"
                    placeholder="Base, Village, Stronghold..."
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label for="dimension">
                    Dimension
                </label>

                <select id="dimension">

                    <option value="Overworld">
                        Overworld
                    </option>

                    <option value="Nether">
                        Nether
                    </option>

                    <option value="The End">
                        The End
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="category">
                    Category
                </label>

                <input
                    id="category"
                    type="text"
                    placeholder="Base, Farm, Village..."
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label for="x">
                    X
                </label>

                <input
                    id="x"
                    type="number"
                    inputmode="decimal"
                    placeholder="0"
                >

            </div>


            <div class="field">

                <label for="y">
                    Y
                </label>

                <input
                    id="y"
                    type="number"
                    inputmode="decimal"
                    placeholder="0"
                >

            </div>


            <div class="field">

                <label for="z">
                    Z
                </label>

                <input
                    id="z"
                    type="number"
                    inputmode="decimal"
                    placeholder="0"
                >

            </div>

        </div>


        <button
            id="saveLocation"
            class="primary add-location-button"
        >
            Save Location
        </button>

    </section>


    <!-- SAVED LOCATIONS -->

    <section class="panel">

        <h2>Saved Locations</h2>


        <div class="controls">

            <input
                id="search"
                type="search"
                placeholder="Search locations..."
                autocomplete="off"
            >


            <select id="dimensionFilter">

                <option value="all">
                    All Dimensions
                </option>

                <option value="Overworld">
                    Overworld
                </option>

                <option value="Nether">
                    Nether
                </option>

                <option value="The End">
                    The End
                </option>

            </select>


            <select id="sort">

                <option value="newest">
                    Newest First
                </option>

                <option value="oldest">
                    Oldest First
                </option>

                <option value="name">
                    Name
                </option>

                <option value="x">
                    X
                </option>

                <option value="y">
                    Y
                </option>

                <option value="z">
                    Z
                </option>

            </select>

        </div>


        <div class="saved-actions">

            <button id="copyAll">
                Copy All
            </button>

            <button
                id="clearAll"
                class="danger"
            >
                Clear All
            </button>

            <div class="location-count">

                <span id="locationCount">
                    0 locations
                </span>

            </div>

        </div>


        <div
            id="locations"
            class="locations"
        ></div>

    </section>

</div>


<!-- MODAL -->

<div
    id="modalBackdrop"
    class="modal-backdrop"
    aria-hidden="true"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <h3 id="modalTitle"></h3>

        <div
            id="modalMessage"
            class="modal-message"
        ></div>

        <div
            id="modalFields"
            class="modal-fields"
        ></div>

        <div class="modal-actions">

            <button id="modalCancel">
                Cancel
            </button>

            <button
                id="modalConfirm"
                class="primary"
            >
                Confirm
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

/* =========================================================
   SAFARI VISUAL VIEWPORT DETECTION
   ========================================================= */

(function setupVisualViewportDetection() {

    const root =
        document.documentElement;


    function updateVisualViewport() {

        if (!window.visualViewport) {

            root.style.setProperty(
                "--visual-top",
                "0px"
            );

            root.style.setProperty(
                "--visual-bottom",
                "0px"
            );

            return;
        }


        const viewport =
            window.visualViewport;


        /*
            Offset from the layout viewport to the
            currently visible viewport.
        */

        const visualTop =
            Math.max(
                0,
                viewport.offsetTop || 0
            );


        /*
            Calculate how much of the layout viewport
            is outside the visible viewport at the bottom.

            This is important for Safari when its URL bar
            is at the bottom of the screen.
        */

        const layoutHeight =
            window.innerHeight;

        const visualBottom =
            Math.max(
                0,
                layoutHeight -
                (
                    (viewport.offsetTop || 0) +
                    viewport.height
                )
            );


        root.style.setProperty(
            "--visual-top",
            visualTop + "px"
        );


        root.style.setProperty(
            "--visual-bottom",
            visualBottom + "px"
        );
    }


    updateVisualViewport();


    window.addEventListener(
        "resize",
        updateVisualViewport,
        { passive: true }
    );


    window.addEventListener(
        "orientationchange",
        updateVisualViewport,
        { passive: true }
    );


    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            updateVisualViewport,
            { passive: true }
        );


        window.visualViewport.addEventListener(
            "scroll",
            updateVisualViewport,
            { passive: true }
        );
    }

})();


/* =========================================================
   DATA
   ========================================================= */

const STORAGE_KEY =
    "minecraft-coordinate-notebook-v2";

const OLD_STORAGE_KEY =
    "minecraft-coordinate-notebook-v1";


let worlds = [];

let currentWorldId = null;


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id =>
    document.getElementById(id);


function createId() {

    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


function currentWorld() {

    return worlds.find(
        world =>
            world.id === currentWorldId
    );
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(worlds)
    );
}


function formatNumber(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number)) {
        return String(value);
    }

    return String(number);
}


function coordinateText(location) {

    return (
        location.name +
        " - X: " +
        formatNumber(location.x) +
        "   Y: " +
        formatNumber(location.y) +
        "   Z: " +
        formatNumber(location.z)
    );
}


/* =========================================================
   INITIALIZE
   ========================================================= */

function initializeData() {

    const savedWorlds =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (savedWorlds) {

        try {

            worlds =
                JSON.parse(
                    savedWorlds
                );


            if (
                !Array.isArray(worlds) ||
                worlds.length === 0
            ) {

                worlds = [];
            }

        } catch {

            worlds = [];
        }
    }


    /*
        Migrate v1 locations into World 1.
    */

    if (worlds.length === 0) {

        let oldLocations = [];


        const oldData =
            localStorage.getItem(
                OLD_STORAGE_KEY
            );


        if (oldData) {

            try {

                const parsed =
                    JSON.parse(
                        oldData
                    );


                if (
                    Array.isArray(parsed)
                ) {

                    oldLocations =
                        parsed;
                }

            } catch {

                oldLocations = [];
            }
        }


        const world = {

            id: createId(),

            name: "World 1",

            seed: "",

            locations:
                oldLocations
        };


        worlds = [world];

        currentWorldId =
            world.id;

        saveData();

    } else {

        worlds =
            worlds.map(
                (world, index) => ({

                    id:
                        world.id ||
                        createId(),

                    name:
                        world.name ||
                        "World " +
                        (index + 1),

                    seed:
                        world.seed || "",

                    locations:
                        Array.isArray(
                            world.locations
                        )
                            ? world.locations
                            : []
                })
            );


        currentWorldId =
            worlds[0].id;

        saveData();
    }


    renderWorlds();

    renderLocations();
}


/* =========================================================
   WORLD RENDER
   ========================================================= */

function renderWorlds() {

    const select =
        $("worldSelect");


    select.innerHTML = "";


    worlds.forEach(world => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            world.id;


        option.textContent =
            world.name;


        if (
            world.id ===
            currentWorldId
        ) {

            option.selected =
                true;
        }


        select.appendChild(
            option
        );
    });


    const world =
        currentWorld();


    if (!world) {
        return;
    }


    $("currentWorldName")
        .textContent =
        world.name;


    $("currentWorldSeed")
        .textContent =
        world.seed ||
        "Not set";


    $("currentWorldLocationCount")
        .textContent =
        world.locations.length;


    $("deleteWorld")
        .disabled =
        worlds.length <= 1;
}


/* =========================================================
   NEW WORLD
   ========================================================= */

function openNewWorldModal() {

    openModal({

        title: "New World",

        message:
            "Create a new Minecraft world.",

        fields: [

            {
                id: "worldName",
                label: "World Name",
                type: "text",
                placeholder: "World 2"
            },

            {
                id: "worldSeed",
                label: "Seed",
                type: "text",
                placeholder: "Optional"
            }

        ],

        confirmText: "Create",

        onConfirm(values) {

            const name =
                values.worldName.trim();


            const seed =
                values.worldSeed.trim();


            if (!name) {

                showToast(
                    "Enter a world name."
                );

                return false;
            }


            const world = {

                id: createId(),

                name,

                seed,

                locations: []
            };


            worlds.push(world);

            currentWorldId =
                world.id;


            saveData();

            renderWorlds();

            renderLocations();


            showToast(
                "World created."
            );


            return true;
        }
    });
}


/* =========================================================
   EDIT WORLD
   ========================================================= */

function openEditWorldModal() {

    const world =
        currentWorld();


    if (!world) {
        return;
    }


    openModal({

        title: "Edit World",

        message:
            "Rename this world or update its seed.",

        fields: [

            {
                id: "worldName",
                label: "World Name",
                type: "text",
                value: world.name,
                placeholder: "World name"
            },

            {
                id: "worldSeed",
                label: "Seed",
                type: "text",
                value: world.seed,
                placeholder: "Optional"
            }

        ],

        onConfirm(values) {

            const name =
                values.worldName.trim();


            const seed =
                values.worldSeed.trim();


            if (!name) {

                showToast(
                    "Enter a world name."
                );

                return false;
            }


            world.name =

            world.seed =
                seed;


            saveData();

            renderWorlds();


            showToast(
                "World updated."
            );


            return true;
        }
    });
}


/* =========================================================
   DELETE WORLD
   ========================================================= */

function deleteCurrentWorld() {

    if (worlds.length <= 1) {

        showToast(
            "You must keep at least one world."
        );

        return;
    }


    const world =
        currentWorld();


    if (!world) {
        return;
    }


    openModal({

        title: "Delete World",

        message:
            'Delete "' +
            world.name +
            '" and all of its saved locations? This cannot be undone.',

        confirmText: "Delete",

        danger: true,

        onConfirm() {

            const index =
                worlds.findIndex(
                    item =>
                        item.id ===
                        currentWorldId
                );


            worlds.splice(
                index,
                1
            );


            currentWorldId =
                worlds[
                    Math.max(
                        0,
                        index - 1
                    )
                ].id;


            saveData();

            renderWorlds();

            renderLocations();


            showToast(
                "World deleted."
            );


            return true;
        }
    });
}


/* =========================================================
   COPY WORLD
   ========================================================= */

function copyWorld() {

    const world = currentWorld();

    if (!world) {
        return;
    }

    let text =
        world.name +
        "\nSeed: " +
        (world.seed || "Not set");

    if (world.locations.length > 0) {

        text +=
            "\n\n" +
            world.locations
                .map(coordinateText)
                .join("\n");
    }

    copyText(text);

    showToast(
        "World name, seed, and coordinates copied."
    );
}


/* =========================================================
   ADD LOCATION
   ========================================================= */

function addLocation() {

    const world =
        currentWorld();


    if (!world) {
        return;
    }


    const name =
        $("locationName")
            .value
            .trim();


    const dimension =
        $("dimension")
            .value;


    const category =
        $("category")
            .value
            .trim();


    const x =
        $("x").value;


    const y =
        $("y").value;


    const z =
        $("z").value;


    if (!name) {

        showToast(
            "Enter a location name."
        );

        $("locationName")
            .focus();

        return;
    }


    if (
        x === "" ||
        y === "" ||
        z === ""
    ) {

        showToast(
            "Enter X, Y, and Z coordinates."
        );

        return;
    }


    world.locations.push({

        id: createId(),

        name,

        dimension,

        category,

        x: Number(x),

        y: Number(y),

        z: Number(z),

        createdAt: Date.now()
    });


    saveData();

    renderWorlds();

    renderLocations();


    $("locationName").value = "";

    $("category").value = "";

    $("x").value = "";

    $("y").value = "";

    $("z").value = "";


    $("locationName")
        .focus();


    showToast(
        "Location saved."
    );
}


/* =========================================================
   EDIT LOCATION
   ========================================================= */

    }

                label: "X",

                showToast(

/* =========================================================
   RENDER LOCATIONS
   ========================================================= */

function renderLocations() {

    const world =
        currentWorld();


    const container =
        $("locations");


    container.innerHTML = "";


    if (!world) {
        return;
    }


    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();


    const dimension =
        $("dimensionFilter")
            .value;


    const sort =
        $("sort")
            .value;


    let locations =
        [...world.locations];


    if (search) {

        locations =
            locations.filter(
                location => {

                    const text = [

                        location.name,

                        location.dimension,

                        location.category,

                        location.x,

                        location.y,

                        location.z

                    ]
                    .join(" ")
                    .toLowerCase();


                    return text.includes(
                        search
                    );
                }
            );
    }


    if (
        dimension !==
        "all"
    ) {

        locations =
            locations.filter(
                location =>
                    location.dimension ===
                    dimension
            );
    }


    if (
        sort ===
        "newest"
    ) {

        locations.sort(
            (a, b) =>
                (b.createdAt || 0) -
                (a.createdAt || 0)
        );

    } else if (
        sort ===
        "oldest"
    ) {

        locations.sort(
            (a, b) =>
                (a.createdAt || 0) -
                (b.createdAt || 0)
        );

    } else if (
        sort ===
        "name"
    ) {

        locations.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name
                )
        );

    } else if (
        sort ===
        "x"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.x) -
                Number(b.x)
        );

    } else if (
        sort ===
        "y"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.y) -
                Number(b.y)
        );

    } else if (
        sort ===
        "z"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.z) -
                Number(b.z)
        );
    }


    $("locationCount")
        .textContent =
        locations.length +
        (
            locations.length === 1
                ? " location"
                : " locations"
        );


    if (
        locations.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-state";


        empty.textContent =
            world.locations.length === 0
                ? "No locations saved yet."
                : "No locations match your search.";


        container.appendChild(
            empty
        );


        return;
    }


    locations.forEach(
        location => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "location-card";


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "location-top";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "location-name";


            name.textContent =
                location.name;


            const dimensionBadge =
                document.createElement(
                    "div"
                );


            dimensionBadge.className =
                "location-dimension";


            dimensionBadge.textContent =
                location.dimension;


            top.appendChild(name);

            top.appendChild(
                dimensionBadge
            );


            const coordinates =
                document.createElement(
                    "div"
                );


            coordinates.className =
                "coordinates";


            coordinates.textContent =
                "X: " +
                formatNumber(location.x) +
                "   Y: " +
                formatNumber(location.y) +
                "   Z: " +
                formatNumber(location.z);


            card.appendChild(top);

            card.appendChild(
                coordinates
            );


            if (
                location.category
            ) {

                const category =
                    document.createElement(
                        "div"
                    );


                category.className =
                    "location-category";


                category.textContent =
                    "Category: " +
                    location.category;


                card.appendChild(
                    category
                );
            }


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "actions";


            /*
                EDIT
            */

            const editButton =
                document.createElement(
                    "button"
                );


            editButton.className =
                "small";


            editButton.textContent =
                "Edit Coordinates";


            editButton.addEventListener(
                "click",
                () => {

                    openEditLocationModal(
                        location.id
                    );
                }
            );


            /*
                COPY
            */

            const copyButton =
                document.createElement(
                    "button"
                );


            copyButton.className =
                "small";


            copyButton.textContent =
                "Copy Coordinates";


            copyButton.addEventListener(
                "click",
                () => {

                    copyText(
                        coordinateText(
                            location
                        )
                    );


                    showToast(
                        "Coordinates copied."
                    );
                }
            );


            /*
                DELETE
            */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "small danger";


            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteLocation(
                        location.id
                    );
                }
            );


            actions.appendChild(
                editButton
            );


            actions.appendChild(
                copyButton
            );


            actions.appendChild(
                deleteButton
            );


            card.appendChild(
                actions
            );


            container.appendChild(
                card
            );
        }
    );
}


/* =========================================================
   DELETE LOCATION
   ========================================================= */

function deleteLocation(id) {

    const world =
        currentWorld();


    if (!world) {
        return;
    }


    const location =
        world.locations.find(
            item =>
                item.id === id
        );


    if (!location) {
        return;
    }


    openModal({

        title: "Delete Location",

        message:
            'Delete "' +
            location.name +
            '"?',

        confirmText: "Delete",

        danger: true,

        onConfirm() {

            world.locations =
                world.locations.filter(
                    item =>
                        item.id !== id
                );


            saveData();

            renderWorlds();

            renderLocations();


            showToast(
                "Location deleted."
            );


            return true;
        }
    });
}


/* =========================================================
   COPY ALL
   ========================================================= */

function copyAll() {

    const world =
        currentWorld();


    if (!world) {
        return;
    }


    if (
        world.locations.length === 0
    ) {

        showToast(
            "There are no locations to copy."
        );

        return;
    }

    );
}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function clearAll() {

    const world =
        currentWorld();


    if (!world) {
        return;
    }


    if (
        world.locations.length === 0
    ) {

        showToast(
            "There are no locations to clear."
        );

        return;
    }


    openModal({

        title: "Clear All Locations",

        message:
            "Delete every saved location in this world? This cannot be undone.",

        confirmText: "Clear All",

        danger: true,

        onConfirm() {

            saveData();

            renderWorlds();

            renderLocations();


            showToast(
                "All locations cleared."
            );


            return true;
        }
    });
}


/* =========================================================
   CLIPBOARD
   ========================================================= */

async function copyText(text) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

            return;
        }

    } catch {
        /* Use fallback. */
    }


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";


    textarea.style.opacity =
        "0";


    textarea.style.pointerEvents =
        "none";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    try {

        document.execCommand(
            "copy"
        );

    } catch {
        /* Nothing else to do. */
    }


    textarea.remove();
}


/* =========================================================
   MODAL
   ========================================================= */

let modalConfirmHandler =
    null;


function openModal(options) {

    $("modalTitle")
        .textContent =
        options.title || "";


    $("modalMessage")
        .textContent =
        options.message || "";


    $("modalFields")
        .innerHTML = "";


    if (options.fields) {

        options.fields.forEach(
            field => {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "field";


                const label =
                    document.createElement(
                        "label"
                    );


                label.textContent =
                    field.label;


                label.htmlFor =
                    "modal-" +
                    field.id;


                let input;


                /*
                    Support select fields in
                    addition to normal inputs.
                */

                if (
                    field.type ===
                    "select"
                ) {

                    input =
                        document.createElement(
                            "select"
                        );


                    [
                        "Overworld",
                        "Nether",
                        "The End"
                    ].forEach(
                        value => {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                value;


                            option.textContent =
                                value;


                            if (
                                value ===
                                field.value
                            ) {

                                option.selected =
                                    true;
                            }


                            input.appendChild(
                                option
                            );
                        }
                    );

                } else {

                    input =
                        document.createElement(
                            "input"
                        );


                    input.type =
                        field.type ||
                        "text";


                    input.placeholder =
                        field.placeholder ||
                        "";


                    input.value =
                        field.value ??
                        "";
                }


                input.id =
                    "modal-" +
                    field.id;


                wrapper.appendChild(
                    label
                );


                wrapper.appendChild(
                    input
                );


                $("modalFields")
                    .appendChild(
                        wrapper
                    );
            }
        );
    }


    $("modalConfirm")
        .textContent =
        options.confirmText ||
        "Confirm";


    $("modalConfirm")
        .classList.toggle(
            "danger",
            !!options.danger
        );


    $("modalConfirm")
        .classList.toggle(
            "primary",
            !options.danger
        );


    modalConfirmHandler =
        options.onConfirm ||
        null;


    $("modalBackdrop")
        .classList.add(
            "open"
        );


    $("modalBackdrop")
        .setAttribute(
            "aria-hidden",
            "false"
        );


    const firstInput =
        $("modalFields")
            .querySelector(
                "input, select"
            );


    if (firstInput) {

        setTimeout(
            () => firstInput.focus(),
            50
        );
    }
}


function closeModal() {

    $("modalBackdrop")
        .classList.remove(
            "open"
        );


    $("modalBackdrop")
        .setAttribute(
            "aria-hidden",
            "true"
        );


    $("modalFields")
        .innerHTML = "";


    modalConfirmHandler =
        null;
}


function getModalValues() {

    const values = {};


    $("modalFields")
        .querySelectorAll(
            "input, select"
        )
        .forEach(
            input => {

                values[
                    input.id.replace(
                        "modal-",
                        ""
                    )
                ] =
                    input.value;
            }
        );


    return values;
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(message) {

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* =========================================================
   EVENTS
   ========================================================= */

$("worldSelect")
    .addEventListener(
        "change",
        event => {

            currentWorldId =
                event.target.value;


            renderWorlds();

            renderLocations();
        }
    );


$("newWorld")
    .addEventListener(
        "click",
        openNewWorldModal
    );


$("editWorld")
    .addEventListener(
        "click",
        openEditWorldModal
    );


$("deleteWorld")
    .addEventListener(
        "click",
        deleteCurrentWorld
    );


$("copyWorld")
    .addEventListener(
        "click",
        copyWorld
    );


$("saveLocation")
    .addEventListener(
        "click",
        addLocation
    );


$("copyAll")
    .addEventListener(
        "click",
        copyAll
    );


$("clearAll")
    .addEventListener(
        "click",
        clearAll
    );


$("search")
    .addEventListener(
        "input",
        renderLocations
    );


$("dimensionFilter")
    .addEventListener(
        "change",
        renderLocations
    );


$("sort")
    .addEventListener(
        "change",
        renderLocations
    );


$("modalCancel")
    .addEventListener(
        "click",
        closeModal
    );


$("modalConfirm")
    .addEventListener(
        "click",
        () => {

            if (
                !modalConfirmHandler
            ) {

                closeModal();

                return;
            }


            const values =
                getModalValues();


            const result =
                modalConfirmHandler(
                    values
                );


            if (
                result !== false
            ) {

                closeModal();
            }
        }
    );


$("modalBackdrop")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("modalBackdrop")
            ) {

                closeModal();
            }
        }
    );


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape" &&
            $("modalBackdrop")
                .classList
                .contains("open")
        ) {

            closeModal();
        }


        if (
            event.key ===
            "Enter" &&
            $("modalBackdrop")
                .classList
                .contains("open")
        ) {

            const active =
                document.activeElement;


            if (
                active &&
                (
                    active.tagName ===
                    "INPUT" ||
                    active.tagName ===
                    "SELECT"
                )
            ) {

                $("modalConfirm")
                    .click();
            }
        }
    }
);


/* =========================================================
   PREVENT ZOOM
   ========================================================= */

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


document.addEventListener(
    "gesturechange",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


document.addEventListener(
    "gestureend",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


let lastTouchEnd = 0;


document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();


        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();
        }


        lastTouchEnd =
            now;
    },
    { passive: false }
);


/* =========================================================
   START
   ========================================================= */

initializeData();

</script>
