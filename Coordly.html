<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<title>Minecraft Coordinate Notebook</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #090b10;
    color: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
}

body {
    padding: 14px;
}

button,
input,
select {
    touch-action: manipulation;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1050px;
    margin: auto;
}

header {
    padding: 8px 4px 18px;
}

h1 {
    margin: 0;
    font-size: 29px;
}

.sub {
    margin: 6px 0 0;
    color: #8f98a8;
}

.layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 14px;
}

.panel {
    background: #11151d;
    border: 1px solid #202733;
    border-radius: 18px;
    padding: 16px;
}

h2 {
    font-size: 18px;
    margin: 0 0 14px;
}

.field {
    margin-bottom: 12px;
}

label {
    display: block;
    color: #aeb6c4;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    background: #0b0e14;
    color: #fff;
    border: 1px solid #29313e;
    border-radius: 11px;
    padding: 12px;
    outline: none;
    min-height: 46px;
}

input:focus,
select:focus {
    border-color: #68758a;
}

.coords {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.primary {
    width: 100%;
    border: 0;
    background: #e8edf4;
    color: #0a0d12;
    padding: 13px;
    border-radius: 11px;
    font-weight: 800;
}

.secondary {
    border: 0;
    background: #202733;
    color: #e8edf4;
    padding: 10px 12px;
    border-radius: 10px;
    font-weight: 700;
}

.danger {
    border: 0;
    background: #321b20;
    color: #ffb9c1;
    padding: 10px 12px;
    border-radius: 10px;
    font-weight: 700;
}

.toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.toolbar select {
    width: auto;
    flex: 1;
    min-width: 130px;
}

.search {
    margin-bottom: 12px;
}

.location {
    background: #0b0e14;
    border: 1px solid #242c38;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
}

.location-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.name {
    font-weight: 850;
    font-size: 17px;
}

.badge {
    display: inline-block;
    margin-top: 5px;
    padding: 4px 8px;
    border-radius: 7px;
    background: #202733;
    color: #aeb7c6;
    font-size: 11px;
}

.xyz {
    margin: 11px 0 0;
    color: #dce2eb;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
}

.overworld {
    margin-top: 8px;
    color: #929baa;
    font-size: 12px;
    line-height: 1.45;
}

.actions {
    display: flex;
    gap: 7px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    padding: 35px 10px;
    color: #7f8999;
}

.stat {
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
    margin-bottom: 14px;
}

.stat div {
    background: #0b0e14;
    border: 1px solid #242c38;
    border-radius: 12px;
    padding: 11px;
}

.stat b {
    display: block;
    font-size: 11px;
    color: #8f98a8;
    margin-bottom: 4px;
}

.stat span {
    font-size: 15px;
    font-weight: 800;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 10;
}

.modal-box {
    width: min(500px, 100%);
    background: #11151d;
    border: 1px solid #29313e;
    border-radius: 18px;
    padding: 18px;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.modal-actions button {
    flex: 1;
}

.hidden {
    display: none !important;
}

.small {
    font-size: 12px;
    color: #929baa;
    line-height: 1.45;
}

@media (max-width: 800px) {

    .layout {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    .coords {
        grid-template-columns: 1fr 1fr 1fr;
    }

    h1 {
        font-size: 25px;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

    <h1>
        Minecraft Coordinate Notebook
    </h1>

    <p class="sub">
        Save and organize important locations in your Minecraft worlds.
    </p>

</header>

<div class="layout">

<section class="panel">

    <h2>
        Add Location
    </h2>

    <div class="field">

        <label>
            Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Castle"
        >

    </div>

    <div class="field">

        <label>
            Dimension
        </label>

        <select id="dim">

            <option>
                Overworld
            </option>

            <option>
                Nether
            </option>

            <option>
                The End
            </option>

        </select>

    </div>

    <div class="coords">

        <div class="field">

            <label>
                X
            </label>

            <input
                id="x"
                type="number"
                step="any"
            >

        </div>

        <div class="field">

            <label>
                Y
            </label>

            <input
                id="y"
                type="number"
                step="any"
            >

        </div>

        <div class="field">

            <label>
                Z
            </label>

            <input
                id="z"
                type="number"
                step="any"
            >

        </div>

    </div>

    <div class="field">

        <label>
            Category
        </label>

        <select id="category">

            <option>
                Important
            </option>

            <option>
                Building
            </option>

            <option>
                Farm
            </option>

            <option>
                Resource
            </option>

            <option>
                Travel
            </option>

            <option>
                Village
            </option>

            <option>
                Portal
            </option>

            <option>
                Other
            </option>

        </select>

    </div>

    <button
        class="primary"
        id="save"
    >
        Save Location
    </button>

</section>

<section class="panel">

    <div class="stat">

        <div>

            <b>
                Saved locations
            </b>

            <span id="count">
                0
            </span>

        </div>

    </div>

    <div class="toolbar">

        <select id="sort">

            <option value="name">
                Name A–Z
            </option>

            <option value="category">
                Category
            </option>

            <option value="dimension">
                Dimension
            </option>

        </select>

        <select id="filter">

            <option value="all">
                All dimensions
            </option>

            <option>
                Overworld
            </option>

            <option>
                Nether
            </option>

            <option>
                The End
            </option>

        </select>

        <button
            class="secondary"
            id="clearAll"
        >
            Clear All
        </button>

    </div>

    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="Search locations or categories..."
        >

    </div>

    <div id="locations"></div>

</section>

</div>

</div>

<div
    id="modal"
    class="modal hidden"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            Confirm
        </h2>

        <p
            id="modalText"
            class="small"
        ></p>

        <div class="modal-actions">

            <button
                class="secondary"
                id="modalCancel"
            >
                Cancel
            </button>

            <button
                class="danger"
                id="modalConfirm"
            >
                Delete
            </button>

        </div>

    </div>

</div>

<script>

(function () {

    const STORAGE_KEY =
        "minecraft-coordinate-notebook-v1";

    let locations =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

    let pendingAction = null;

    function $(id) {
        return document.getElementById(id);
    }

    function num(id) {
        return Number($(id).value) || 0;
    }

    function saveData() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(locations)
        );

    }

    function fmt(number) {

        if (Number.isInteger(number)) {
            return String(number);
        }

        return Number(
            number.toFixed(2)
        ).toString();

    }

    function escapeHTML(value) {

        return String(value).replace(
            /[&<>"']/g,
            function (character) {

                const replacements = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return replacements[character];

            }
        );

    }

    function getOverworldCoordinates(location) {

        if (location.dim === "Overworld") {

            return {
                x: location.x,
                y: location.y,
                z: location.z
            };

        }

        if (location.dim === "Nether") {

            return {
                x: location.x * 8,
                y: location.y,
                z: location.z * 8
            };

        }

        return null;

    }

    $("save").addEventListener(
        "click",
        function () {

            const name =
                $("name").value.trim();

            if (!name) {

                showModal(
                    "Missing name",
                    "Give this location a name before saving.",
                    null,
                    "OK"
                );

                return;

            }

            const location = {

                id:
                    Date.now() +
                    Math.random(),

                name:
                    name,

                dim:
                    $("dim").value,

                x:
                    num("x"),

                y:
                    num("y"),

                z:
                    num("z"),

                category:
                    $("category").value

            };

            locations.push(location);

            saveData();

            render();

            $("name").value = "";
            $("x").value = "";
            $("y").value = "";
            $("z").value = "";

        }
    );

    function showModal(
        title,
        text,
        action,
        confirmText
    ) {

        $("modalTitle").textContent =
            title;

        $("modalText").textContent =
            text;

        $("modalConfirm").textContent =
            confirmText || "Delete";

        pendingAction =
            action;

        $("modal")
            .classList
            .remove("hidden");

    }

    $("modalCancel").addEventListener(
        "click",
        function () {

            $("modal")
                .classList
                .add("hidden");

            pendingAction = null;

        }
    );

    $("modalConfirm").addEventListener(
        "click",
        function () {

            if (pendingAction) {
                pendingAction();
            }

            $("modal")
                .classList
                .add("hidden");

            pendingAction = null;

        }
    );

    $("clearAll").addEventListener(
        "click",
        function () {

            if (!locations.length) {
                return;
            }

            showModal(
                "Clear all locations",
                "This will permanently remove every saved location from this browser.",
                function () {

                    locations = [];

                    saveData();

                    render();

                },
                "Clear All"
            );

        }
    );

    $("search").addEventListener(
        "input",
        render
    );

    $("sort").addEventListener(
        "change",
        render
    );

    $("filter").addEventListener(
        "change",
        render
    );

    function render() {

        $("count").textContent =
            locations.length;

        let list =
            locations.filter(
                function (location) {

                    const query =
                        $("search")
                            .value
                            .trim()
                            .toLowerCase();

                    const filter =
                        $("filter").value;

                    const searchable =
                        (
                            location.name +
                            " " +
                            location.category +
                            " " +
                            location.dim
                        ).toLowerCase();

                    return (

                        (
                            filter === "all" ||
                            location.dim === filter
                        )

                        &&

                        (
                            !query ||
                            searchable.includes(query)
                        )

                    );

                }
            );

        list.sort(
            function (a, b) {

                if (
                    $("sort").value ===
                    "name"
                ) {

                    return a.name.localeCompare(
                        b.name
                    );

                }

                if (
                    $("sort").value ===
                    "category"
                ) {

                    return (
                        a.category.localeCompare(
                            b.category
                        ) ||
                        a.name.localeCompare(
                            b.name
                        )
                    );

                }

                return (
                    a.dim.localeCompare(
                        b.dim
                    ) ||
                    a.name.localeCompare(
                        b.name
                    )
                );

            }
        );

        if (!list.length) {

            $("locations").innerHTML =
                '<div class="empty">' +
                'No locations match your search.' +
                '</div>';

            return;

        }

        $("locations").innerHTML =
            list.map(
                function (location) {

                    const overworld =
                        getOverworldCoordinates(
                            location
                        );

                    let overworldHTML = "";

                    if (overworld) {

                        overworldHTML =
                            '<div class="overworld">' +

                            'Overworld: ' +

                            'X ' +
                            fmt(overworld.x) +

                            ' &nbsp; Y ' +
                            fmt(overworld.y) +

                            ' &nbsp; Z ' +
                            fmt(overworld.z) +

                            '</div>';

                    }

                    return (

                        '<article class="location">' +

                        '<div class="location-top">' +

                        '<div>' +

                        '<div class="name">' +
                        escapeHTML(
                            location.name
                        ) +
                        '</div>' +

                        '<span class="badge">' +

                        escapeHTML(
                            location.category
                        ) +

                        ' • ' +

                        escapeHTML(
                            location.dim
                        ) +

                        '</span>' +

                        '</div>' +

                        '</div>' +

                        '<div class="xyz">' +

                        escapeHTML(
                            location.dim
                        ) +

                        '<br>' +

                        'X ' +
                        fmt(location.x) +

                        ' &nbsp; Y ' +
                        fmt(location.y) +

                        ' &nbsp; Z ' +
                        fmt(location.z) +

                        '</div>' +

                        overworldHTML +

                        '<div class="actions">' +

                        '<button ' +
                        'class="danger" ' +
                        'data-delete="' +
                        location.id +
                        '">' +

                        'Delete' +

                        '</button>' +

                        '</div>' +

                        '</article>'

                    );

                }
            ).join("");

        document
            .querySelectorAll("[data-delete]")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const location =
                                locations.find(
                                    function (item) {

                                        return String(
                                            item.id
                                        ) ===
                                        button.dataset.delete;

                                    }
                                );

                            if (!location) {
                                return;
                            }

                            showModal(
                                "Delete location",
                                "Delete “" +
                                location.name +
                                "” from your notebook?",

                                function () {

                                    locations =
                                        locations.filter(
                                            function (item) {

                                                return item.id !==
                                                    location.id;

                                            }
                                        );

                                    saveData();

                                    render();

                                },

                                "Delete"
                            );

                        }
                    );

                }
            );

    }

    render();

})();

</script>

<script>

/*
    Disable browser zoom.

    Multi-touch is blocked during capture,
    before buttons or other page elements
    can process the gesture.
*/

(function () {

    let lastTouchEnd = 0;

    function blockMultiTouch(event) {

        if (
            event.touches &&
            event.touches.length > 1
        ) {

            event.preventDefault();
            event.stopPropagation();

        }

    }

    document.addEventListener(
        "touchstart",
        blockMultiTouch,
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "touchmove",
        blockMultiTouch,
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "gesturestart",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

        },
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "gesturechange",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

        },
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "gestureend",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

        },
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "touchend",
        function (event) {

            const now = Date.now();

            if (
                now - lastTouchEnd < 300
            ) {

                event.preventDefault();
                event.stopPropagation();

            }

            lastTouchEnd = now;

        },
        {
            passive: false,
            capture: true
        }
    );

    document.addEventListener(
        "wheel",
        function (event) {

            if (event.ctrlKey) {
                event.preventDefault();
            }

        },
        {
            passive: false,
            capture: true
        }
    );

})();

</script>

</body>
</html>
