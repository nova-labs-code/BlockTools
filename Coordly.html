<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Coordly</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: #0d1117;
    overflow-x: hidden;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background: #0d1117;
    color: #f0f3f6;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;

    /*
       Safe-area support for iPhone/iPad.
       The top padding keeps content away from
       the browser/device area.
    */
    padding-top: max(20px, env(safe-area-inset-top));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));

    touch-action: manipulation;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

.header {
    margin-bottom: 18px;
    padding-top: 4px;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 32px;
    line-height: 1.15;
}

.header p {
    margin: 0;
    color: #8b949e;
    line-height: 1.4;
}

/* =========================
   PANELS
========================= */

.panel {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;

    overflow: hidden;
}

.panel h2 {
    margin: 0 0 14px;
    font-size: 21px;
    line-height: 1.25;
}

.layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
}

/* =========================
   FIELDS
========================= */

.field {
    width: 100%;
    margin-bottom: 12px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #c9d1d9;
}

input,
select {
    display: block;
    width: 100%;
    min-width: 0;

    padding: 12px;

    border-radius: 9px;
    border: 1px solid #30363d;

    background: #0d1117;
    color: #f0f3f6;

    outline: none;

    -webkit-appearance: none;
    appearance: none;
}

input {
    min-height: 44px;
}

select {
    min-height: 44px;
}

input:focus,
select:focus {
    border-color: #58a6ff;
}

/* =========================
   BUTTONS
========================= */

button {
    min-height: 44px;

    border: 0;
    border-radius: 9px;

    padding: 10px 14px;

    background: #238636;
    color: white;

    font-weight: 600;

    white-space: normal;
}

button:hover {
    filter: brightness(1.08);
}

button:active {
    transform: scale(0.98);
}

button.secondary {
    background: #21262d;
    border: 1px solid #30363d;
}

button.danger {
    background: #da3633;
}

button.blue {
    background: #1f6feb;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* =========================
   WORLD INFO
========================= */

.world-info {
    width: 100%;

    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;

    padding: 12px;
    margin-top: 12px;

    overflow: hidden;
}

.world-info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;

    margin-bottom: 8px;
}

.world-info-row:last-child {
    margin-bottom: 0;
}

.world-info-label {
    color: #8b949e;
    flex-shrink: 0;
}

.world-info-value {
    text-align: right;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.world-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.world-actions button {
    flex: 1 1 auto;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: grid;
    grid-template-columns: 1fr 170px 170px;
    gap: 10px;
    margin-bottom: 14px;
}

.controls > * {
    min-width: 0;
}

/* =========================
   LOCATION CARDS
========================= */

.location-card {
    width: 100%;

    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;

    padding: 14px;
    margin-bottom: 10px;

    overflow: hidden;
}

.location-card:last-child {
    margin-bottom: 0;
}

.location-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;

    min-width: 0;
}

.location-name {
    font-size: 18px;
    font-weight: 700;

    overflow-wrap: anywhere;
    word-break: break-word;
}

.dimension {
    display: inline-block;

    margin-top: 5px;

    padding: 4px 8px;

    border-radius: 999px;

    font-size: 12px;

    background: #21262d;
    color: #c9d1d9;

    max-width: 100%;

    overflow-wrap: anywhere;
}

.coordinates {
    width: 100%;

    margin-top: 12px;
    padding: 10px;

    border-radius: 8px;

    background: #161b22;

    font-family: monospace;

    overflow-x: auto;
    overflow-y: hidden;

    white-space: nowrap;

    -webkit-overflow-scrolling: touch;
}

.location-card .actions {
    margin-top: 10px;
}

.location-card .actions button {
    flex: 1 1 auto;
}

/* =========================
   EMPTY / COUNT
========================= */

.empty {
    text-align: center;
    padding: 25px 10px;
    color: #8b949e;
}

.count {
    color: #8b949e;
    font-size: 14px;
    margin-bottom: 12px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
    position: fixed;

    /*
       Safe-area-aware modal.
    */
    inset: 0;

    padding-top: max(18px, env(safe-area-inset-top));
    padding-right: max(18px, env(safe-area-inset-right));
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    padding-left: max(18px, env(safe-area-inset-left));

    background: rgba(0, 0, 0, 0.72);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 1000;

    overflow-y: auto;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 440px;

    max-height: calc(100dvh - 36px);

    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;

    padding: 18px;

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

    overflow-y: auto;
}

.modal h3 {
    margin: 0 0 10px;
    font-size: 21px;
}

.modal p {
    margin: 0 0 16px;
    color: #8b949e;
    line-height: 1.5;
}

.modal .field {
    margin-bottom: 12px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;

    margin-top: 16px;

    flex-wrap: wrap;
}

.modal-actions button {
    flex: 1 1 120px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;

    /*
       Keep the toast above the iPhone home indicator.
    */
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 10px));

    transform: translateX(-50%) translateY(20px);

    width: max-content;
    max-width: calc(100vw - 30px);

    background: #238636;
    color: white;

    padding: 11px 16px;

    border-radius: 9px;

    opacity: 0;
    pointer-events: none;

    transition: 0.2s ease;

    z-index: 2000;

    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        padding-top: max(14px, env(safe-area-inset-top));
        padding-right: max(10px, env(safe-area-inset-right));
        padding-bottom: max(18px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
    }

    .header {
        margin-bottom: 14px;
        padding-top: 4px;
    }

    .header h1 {
        font-size: 28px;
    }

    .header p {
        font-size: 14px;
    }

    .panel {
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 12px;
    }

    .panel h2 {
        font-size: 20px;
    }

    .controls {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .world-actions {
        display: grid;
        grid-template-columns: 1fr;
    }

    .world-actions button {
        width: 100%;
    }

    .world-info-row {
        flex-direction: column;
        gap: 3px;
    }

    .world-info-value {
        text-align: left;
        width: 100%;
    }

    .location-card {
        padding: 12px;
    }

    .location-top {
        display: block;
    }

    .location-name {
        font-size: 17px;
    }

    .location-card .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .location-card .actions button {
        width: 100%;
    }

    .modal {
        border-radius: 12px;
        padding: 15px;
    }

    .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .modal-actions button {
        width: 100%;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

    body {
        padding-right: 8px;
        padding-left: 8px;
    }

    .panel {
        padding: 12px;
    }

    .location-card .actions {
        grid-template-columns: 1fr;
    }

    .modal-actions {
        grid-template-columns: 1fr;
    }

    button {
        padding-left: 11px;
        padding-right: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Coordly</h1>
        <p>Save and organize your Minecraft coordinates.</p>
    </div>

    <!-- WORLDS -->
    <div class="panel">

        <h2>Worlds</h2>

        <div class="field">
            <label for="worldSelect">World</label>

            <select id="worldSelect"></select>
        </div>

        <div class="world-info">

            <div class="world-info-row">
                <span class="world-info-label">
                    World Name
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldName"
                >
                    World 1
                </span>
            </div>

            <div class="world-info-row">
                <span class="world-info-label">
                    Seed
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldSeed"
                >
                    Not set
                </span>
            </div>

            <div class="world-info-row">
                <span class="world-info-label">
                    Locations
                </span>

                <span
                    class="world-info-value"
                    id="currentWorldLocationCount"
                >
                    0
                </span>
            </div>

        </div>

        <div class="world-actions">

            <button
                class="blue"
                id="newWorld"
            >
                New World
            </button>

            <button
                class="secondary"
                id="editWorld"
            >
                Rename / Edit World
            </button>

            <button
                class="danger"
                id="deleteWorld"
            >
                Delete World
            </button>

        </div>

    </div>

    <div class="layout">

        <!-- ADD LOCATION -->
        <div class="panel">

            <h2>Add Location</h2>

            <form id="locationForm">

                <div class="field">
                    <label for="locationName">
                        Name
                    </label>

                    <input
                        id="locationName"
                        type="text"
                        placeholder="My Base"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="field">
                    <label for="dimension">
                        Dimension
                    </label>

                    <select id="dimension">

                        <option value="Overworld">
                            Overworld
                        </option>

                        <option value="Nether">
                            Nether
                        </option>

                        <option value="End">
                            End
                        </option>

                    </select>
                </div>

                <div class="field">
                    <label for="x">
                        X
                    </label>

                    <input
                        id="x"
                        type="number"
                        step="any"
                        inputmode="decimal"
                        placeholder="0"
                        required
                    >
                </div>

                <div class="field">
                    <label for="y">
                        Y
                    </label>

                    <input
                        id="y"
                        type="number"
                        step="any"
                        inputmode="decimal"
                        placeholder="64"
                        required
                    >
                </div>

                <div class="field">
                    <label for="z">
                        Z
                    </label>

                    <input
                        id="z"
                        type="number"
                        step="any"
                        inputmode="decimal"
                        placeholder="0"
                        required
                    >
                </div>

                <div class="field">
                    <label for="category">
                        Category
                    </label>

                    <input
                        id="category"
                        type="text"
                        placeholder="Base, Farm, Village..."
                        autocomplete="off"
                    >
                </div>

                <button type="submit">
                    Save Location
                </button>

            </form>

        </div>

        <!-- SAVED LOCATIONS -->
        <div class="panel">

            <h2>Saved Locations</h2>

            <div class="controls">

                <input
                    id="search"
                    type="search"
                    placeholder="Search locations..."
                    autocomplete="off"
                >

                <select id="dimensionFilter">

                    <option value="all">
                        All Dimensions
                    </option>

                    <option value="Overworld">
                        Overworld
                    </option>

                    <option value="Nether">
                        Nether
                    </option>

                    <option value="End">
                        End
                    </option>

                </select>

                <select id="sort">

                    <option value="name">
                        Name
                    </option>

                    <option value="x">
                        X
                    </option>

                    <option value="y">
                        Y
                    </option>

                    <option value="z">
                        Z
                    </option>

                    <option value="newest">
                        Newest
                    </option>

                    <option value="oldest">
                        Oldest
                    </option>

                </select>

            </div>

            <div
                class="actions"
                style="margin-bottom: 12px;"
            >

                <button
                    class="blue"
                    id="copyAll"
                >
                    Copy All
                </button>

                <button
                    class="danger"
                    id="clearAll"
                >
                    Clear All
                </button>

            </div>

            <div
                class="count"
                id="count"
            ></div>

            <div id="locations"></div>

        </div>

    </div>

</div>

<!-- CUSTOM MODAL -->

<div
    class="modal-backdrop"
    id="modalBackdrop"
>

    <div class="modal">

        <h3 id="modalTitle">
            Confirm
        </h3>

        <p id="modalMessage"></p>

        <div id="modalFields"></div>

        <div class="modal-actions">

            <button
                class="secondary"
                id="modalCancel"
            >
                Cancel
            </button>

            <button
                id="modalConfirm"
            >
                Confirm
            </button>

        </div>

    </div>

</div>

<div
    class="toast"
    id="toast"
></div>

<script>
const STORAGE_KEY =
    "minecraft-coordinate-notebook-v2";

const OLD_STORAGE_KEY =
    "minecraft-coordinate-notebook-v1";

let worlds = [];
let currentWorldId = null;

const $ = id =>
    document.getElementById(id);

/* =========================
   BASIC HELPERS
========================= */

function createId() {

    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(worlds)
    );

}

function getCurrentWorld() {

    return worlds.find(
        world =>
            world.id === currentWorldId
    );

}

function formatNumber(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return value;
    }

    return Number.isInteger(number)
        ? String(number)
        : String(number);

}

function coordinateText(location) {

    return (
        location.name +
        " - X: " +
        formatNumber(location.x) +
        "   Y: " +
        formatNumber(location.y) +
        "   Z: " +
        formatNumber(location.z)
    );

}

/* =========================
   INITIALIZATION
========================= */

function initializeData() {

    const savedWorlds =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (savedWorlds) {

        try {

            worlds =
                JSON.parse(savedWorlds);

            if (
                !Array.isArray(worlds) ||
                worlds.length === 0
            ) {
                worlds = [];
            }

        } catch {

            worlds = [];

        }

    }

    /*
       If there are no v2 worlds,
       migrate every old location into
       World 1.
    */

    if (worlds.length === 0) {

        let oldLocations = [];

        const oldData =
            localStorage.getItem(
                OLD_STORAGE_KEY
            );

        if (oldData) {

            try {

                const parsed =
                    JSON.parse(oldData);

                if (Array.isArray(parsed)) {
                    oldLocations = parsed;
                }

            } catch {

                oldLocations = [];

            }

        }

        worlds = [
            {
                id: createId(),
                name: "World 1",
                seed: "",
                locations: oldLocations
            }
        ];

        currentWorldId =
            worlds[0].id;

        saveData();

    } else {

        worlds = worlds.map(
            (world, index) => ({

                id:
                    world.id ||
                    createId(),

                name:
                    world.name ||
                    "World " +
                    (index + 1),

                seed:
                    world.seed ||
                    "",

                locations:
                    Array.isArray(
                        world.locations
                    )
                        ? world.locations
                        : []

            })
        );

        currentWorldId =
            worlds[0].id;

        saveData();

    }

    renderWorlds();
    renderLocations();

}

/* =========================
   WORLDS
========================= */

function renderWorlds() {

    const select =
        $("worldSelect");

    select.innerHTML = "";

    worlds.forEach(
        (world, index) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                world.id;

            option.textContent =
                world.name ||
                "World " +
                (index + 1);

            select.appendChild(
                option
            );

        }
    );

    if (
        !worlds.some(
            world =>
                world.id ===
                currentWorldId
        )
    ) {

        currentWorldId =
            worlds[0]?.id ||
            null;

    }

    if (currentWorldId) {

        select.value =
            currentWorldId;

    }

    updateWorldInfo();

}

function updateWorldInfo() {

    const world =
        getCurrentWorld();

    if (!world) {

        $("currentWorldName")
            .textContent =
            "No world";

        $("currentWorldSeed")
            .textContent =
            "Not set";

        $("currentWorldLocationCount")
            .textContent =
            "0";

        return;
    }

    $("currentWorldName")
        .textContent =
        world.name;

    $("currentWorldSeed")
        .textContent =
        world.seed === ""
            ? "Not set"
            : world.seed;

    $("currentWorldLocationCount")
        .textContent =
        world.locations.length;

}

/* =========================
   MODAL
========================= */

let modalConfirmAction =
    null;

function openModal({
    title,
    message = "",
    fields = [],
    confirmText = "Confirm",
    danger = false,
    onConfirm
}) {

    $("modalTitle")
        .textContent =
        title;

    $("modalMessage")
        .textContent =
        message;

    const fieldsContainer =
        $("modalFields");

    fieldsContainer.innerHTML =
        "";

    fields.forEach(field => {

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "field";

        const label =
            document.createElement(
                "label"
            );

        label.textContent =
            field.label;

        label.htmlFor =
            field.id;

        const input =
            document.createElement(
                "input"
            );

        input.id =
            field.id;

        input.type =
            field.type ||
            "text";

        input.placeholder =
            field.placeholder ||
            "";

        input.value =
            field.value ?? "";

        if (field.required) {
            input.required =
                true;
        }

        wrapper.appendChild(label);
        wrapper.appendChild(input);

        fieldsContainer.appendChild(
            wrapper
        );

    });

    const confirmButton =
        $("modalConfirm");

    confirmButton.textContent =
        confirmText;

    confirmButton.classList.toggle(
        "danger",
        danger
    );

    confirmButton.classList.toggle(
        "blue",
        !danger
    );

    modalConfirmAction =
        onConfirm;

    $("modalBackdrop")
        .classList.add("show");

    const firstInput =
        fieldsContainer.querySelector(
            "input"
        );

    if (firstInput) {

        setTimeout(
            () => firstInput.focus(),
            50
        );

    }

}

function closeModal() {

    $("modalBackdrop")
        .classList.remove(
            "show"
        );

    $("modalFields")
        .innerHTML =
        "";

    modalConfirmAction =
        null;

}

$("modalCancel")
    .addEventListener(
        "click",
        closeModal
    );

$("modalBackdrop")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("modalBackdrop")
            ) {
                closeModal();
            }

        }
    );

$("modalConfirm")
    .addEventListener(
        "click",
        () => {

            if (
                typeof modalConfirmAction ===
                "function"
            ) {

                modalConfirmAction();

            }

        }
    );

/* =========================
   NEW WORLD
========================= */

$("newWorld")
    .addEventListener(
        "click",
        () => {

            openModal({

                title:
                    "Create World",

                message:
                    "Enter the name and seed for your new world.",

                fields: [

                    {
                        id:
                            "worldNameInput",

                        label:
                            "World Name",

                        placeholder:
                            "World 2",

                        required:
                            true
                    },

                    {
                        id:
                            "worldSeedInput",

                        label:
                            "Seed",

                        placeholder:
                            "Optional"
                    }

                ],

                confirmText:
                    "Create World",

                onConfirm:
                    () => {

                        const name =
                            $(
                                "worldNameInput"
                            )
                                .value
                                .trim();

                        const seed =
                            $(
                                "worldSeedInput"
                            )
                                .value
                                .trim();

                        if (!name) {

                            showToast(
                                "Enter a world name."
                            );

                            return;

                        }

                        const world = {

                            id:
                                createId(),

                            name,

                            seed,

                            locations:
                                []

                        };

                        worlds.push(
                            world
                        );

                        currentWorldId =
                            world.id;

                        saveData();

                        renderWorlds();
                        renderLocations();

                        closeModal();

                        showToast(
                            "World created."
                        );

                    }

            });

        }
    );

/* =========================
   EDIT WORLD
========================= */

$("editWorld")
    .addEventListener(
        "click",
        () => {

            const world =
                getCurrentWorld();

            if (!world) {
                return;
            }

            openModal({

                title:
                    "Edit World",

                message:
                    "Change the name or seed for this world.",

                fields: [

                    {
                        id:
                            "editWorldName",

                        label:
                            "World Name",

                        value:
                            world.name,

                        required:
                            true
                    },

                    {
                        id:
                            "editWorldSeed",

                        label:
                            "Seed",

                        value:
                            world.seed ||
                            "",

                        placeholder:
                            "Optional"
                    }

                ],

                confirmText:
                    "Save Changes",

                onConfirm:
                    () => {

                        const name =
                            $(
                                "editWorldName"
                            )
                                .value
                                .trim();

                        const seed =
                            $(
                                "editWorldSeed"
                            )
                                .value
                                .trim();

                        if (!name) {

                            showToast(
                                "Enter a world name."
                            );

                            return;

                        }

                        world.name =
                            name;

                        world.seed =

                        saveData();

                        renderWorlds();
                        renderLocations();

                        closeModal();

                        showToast(
                            "World updated."
                        );

                    }

            });

        }
    );

/* =========================
   DELETE WORLD
========================= */

$("deleteWorld")
    .addEventListener(
        "click",
        () => {

            const world =
                getCurrentWorld();

            if (!world) {
                return;
            }

            if (worlds.length <= 1) {

                openModal({

                    title:
                        "Cannot Delete World",

                    message:
                        "You must keep at least one world.",

                    confirmText:
                        "OK",

                    onConfirm:
                        closeModal

                });

                return;

            }

            openModal({

                title:
                    "Delete World?",

                message:
                    'This will permanently delete "' +
                    world.name +
                    '" and all of its saved locations.',

                confirmText:
                    "Delete World",

                danger:
                    true,

                onConfirm:
                    () => {

                        worlds =
                            worlds.filter(
                                item =>
                                    item.id !==
                                    world.id
                            );

                        currentWorldId =
                            worlds[0].id;

                        saveData();

                        renderWorlds();
                        renderLocations();

                        closeModal();

                        showToast(
                            "World deleted."
                        );

                    }

            });

        }
    );

/* =========================
   WORLD SWITCH
========================= */

$("worldSelect")
    .addEventListener(
        "change",
        event => {

            currentWorldId =
                event.target.value;

            renderLocations();
            updateWorldInfo();

        }
    );

/* =========================
   ADD LOCATION
========================= */

$("locationForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const world =
                getCurrentWorld();

            if (!world) {

                showToast(
                    "Create a world first."
                );

                return;

            }

            const location = {

                id:
                    createId(),

                name:
                    $("locationName")
                        .value
                        .trim(),

                dimension:
                    $("dimension")
                        .value,

                x:
                    Number(
                        $("x").value
                    ),

                y:
                    Number(
                        $("y").value
                    ),

                z:
                    Number(
                        $("z").value
                    ),

                category:
                    $("category")
                        .value
                        .trim(),

                createdAt:
                    Date.now()

            };

            if (
                !location.name ||
                !Number.isFinite(
                    location.x
                ) ||
                !Number.isFinite(
                    location.y
                ) ||
                !Number.isFinite(
                    location.z
                )
            ) {

                showToast(
                    "Please enter valid location information."
                );

                return;

            }

            world.locations.push(
                location
            );

            saveData();

            renderLocations();
            updateWorldInfo();

            $("locationForm")
                .reset();

            showToast(
                "Location saved."
            );

        }
    );

/* =========================
   SEARCH / FILTER / SORT
========================= */

$("search")
    .addEventListener(
        "input",
        renderLocations
    );

$("dimensionFilter")
    .addEventListener(
        "change",
        renderLocations
    );

$("sort")
    .addEventListener(
        "change",
        renderLocations
    );

/* =========================
   RENDER LOCATIONS
========================= */

function renderLocations() {

    const container =
        $("locations");

    const world =
        getCurrentWorld();

    container.innerHTML =
        "";

    if (!world) {

        container.innerHTML =
            '<div class="empty">No world selected.</div>';

        $("count")
            .textContent =
            "";

        return;
    }

    let locations =
        [...world.locations];

    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();

    const dimension =
        $("dimensionFilter")
            .value;

    if (search) {

        locations =
            locations.filter(
                location => {

                    return (

                        location.name
                            .toLowerCase()
                            .includes(
                                search
                            )

                        ||

                        location.dimension
                            .toLowerCase()
                            .includes(
                                search
                            )

                        ||

                        (
                            location.category ||
                            ""
                        )
                            .toLowerCase()
                            .includes(
                                search
                            )

                        ||

                        String(
                            location.x
                        ).includes(
                            search
                        )

                        ||

                        String(
                            location.y
                        ).includes(
                            search
                        )

                        ||

                        String(
                            location.z
                        ).includes(
                            search
                        )

                    );

                }
            );

    }

    if (
        dimension !==
        "all"
    ) {

        locations =
            locations.filter(
                location =>
                    location.dimension ===
                    dimension
            );

    }

    const sort =
        $("sort").value;

    if (sort === "name") {

        locations.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name
                )
        );

    } else if (
        sort === "x"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.x) -
                Number(b.x)
        );

    } else if (
        sort === "y"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.y) -
                Number(b.y)
        );

    } else if (
        sort === "z"
    ) {

        locations.sort(
            (a, b) =>
                Number(a.z) -
                Number(b.z)
        );

    } else if (
        sort === "newest"
    ) {

        locations.sort(
            (a, b) =>
                Number(
                    b.createdAt ||
                    0
                ) -
                Number(
                    a.createdAt ||
                    0
                )
        );

    } else if (
        sort === "oldest"
    ) {

        locations.sort(
            (a, b) =>
                Number(
                    a.createdAt ||
                    0
                ) -
                Number(
                    b.createdAt ||
                    0
                )
        );

    }

    $("count")
        .textContent =
        locations.length +
        " location" +
        (
            locations.length === 1
                ? ""
                : "s"
        ) +
        " shown";

    if (
        locations.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">No locations found.</div>';

        return;

    }

    locations.forEach(
        location => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "location-card";

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "location-top";

            const titleArea =
                document.createElement(
                    "div"
                );

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "location-name";

            name.textContent =
                location.name;

            const dimension =
                document.createElement(
                    "div"
                );

            dimension.className =
                "dimension";

            dimension.textContent =
                location.dimension;

            titleArea.appendChild(
                name
            );

            titleArea.appendChild(
                dimension
            );

            if (
                location.category
            ) {

                const category =
                    document.createElement(
                        "div"
                    );

                category.className =
                    "dimension";

                category.textContent =
                    location.category;

                titleArea.appendChild(
                    category
                );

            }

            top.appendChild(
                titleArea
            );

            card.appendChild(
                top
            );

            const coordinates =
                document.createElement(
                    "div"
                );

            coordinates.className =
                "coordinates";

            coordinates.textContent =
                "X: " +
                formatNumber(
                    location.x
                ) +
                "   Y: " +
                formatNumber(
                    location.y
                ) +
                "   Z: " +
                formatNumber(
                    location.z
                );

            card.appendChild(
                coordinates
            );

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "actions";

            const copyButton =
                document.createElement(
                    "button"
                );

            copyButton.className =
                "blue";

            copyButton.textContent =
                "Copy Coordinates";

            copyButton.addEventListener(
                "click",
                async () => {

                    try {

                        await copyText(
                            coordinateText(
                                location
                            )
                        );

                        copyButton.textContent =
                            "Copied!";

                        setTimeout(
                            () => {

                                copyButton.textContent =
                                    "Copy Coordinates";

                            },
                            1200
                        );

                    } catch {

                        showToast(
                            "Could not copy coordinates."
                        );

                    }

                }
            );

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "danger";

            deleteButton.textContent =
                "Delete";

            deleteButton.addEventListener(
                "click",
                () => {

                    openModal({

                        title:
                            "Delete Location?",

                        message:
                            'Delete "' +
                            location.name +
                            '" from this world?',

                        confirmText:
                            "Delete",

                        danger:
                            true,

                        onConfirm:
                            () => {

                                world.locations =
                                    world.locations.filter(
                                        item =>
                                            item.id !==
                                            location.id
                                    );

                                saveData();

                                renderLocations();
                                updateWorldInfo();

                                closeModal();

                                showToast(
                                    "Location deleted."
                                );

                            }

                    });

                }
            );

            actions.appendChild(
                copyButton
            );

            actions.appendChild(
                deleteButton
            );

            card.appendChild(
                actions
            );

            container.appendChild(
                card
            );

        }
    );

}

/* =========================
   COPY
========================= */

async function copyText(text) {

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        await navigator.clipboard
            .writeText(text);

        return;
    }

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    document.body.appendChild(
        textarea
    );

    textarea.focus();
    textarea.select();

    const successful =
        document.execCommand(
            "copy"
        );

    document.body.removeChild(
        textarea
    );

    if (!successful) {
        throw new Error(
            "Copy failed"
        );
    }

}

/* =========================
   COPY ALL
========================= */

$("copyAll")
    .addEventListener(
        "click",
        async () => {

            const world =
                getCurrentWorld();

            if (
                !world ||
                world.locations.length === 0
            ) {

                showToast(
                    "There are no saved locations to copy."
                );

                return;

            }

            const text =
                world.locations
                    .map(
                        coordinateText
                    )
                    .join("\n");

            try {

                await copyText(
                    text
                );

                const button =
                    $("copyAll");

                const oldText =
                    button.textContent;

                button.textContent =
                    "Copied All!";

                setTimeout(
                    () => {

                        button.textContent =
                            oldText;

                    },
                    1200
                );

            } catch {

                showToast(
                    "Could not copy locations."
                );

            }

        }
    );

/* =========================
   CLEAR ALL
========================= */

$("clearAll")
    .addEventListener(
        "click",
        () => {

            const world =
                getCurrentWorld();

            if (
                !world ||
                world.locations.length === 0
            ) {

                showToast(
                    "There are no locations to clear."
                );

                return;

            }

            openModal({

                title:
                    "Clear All Locations?",

                message:
                    "This will permanently delete all " +
                    world.locations.length +
                    " saved locations from \"" +
                    world.name +
                    "\".",

                confirmText:
                    "Clear All",

                danger:
                    true,

                onConfirm:
                    () => {

                        world.locations =
                            [];

                        saveData();

                        renderLocations();
                        updateWorldInfo();

                        closeModal();

                        showToast(
                            "All locations cleared."
                        );

                    }

            });

        }
    );

/* =========================
   TOAST
========================= */

let toastTimeout;

function showToast(message) {

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimeout
    );

    toastTimeout =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}

/* =========================
   DISABLE ZOOM
========================= */

document.addEventListener(
    "gesturestart",
    event =>
        event.preventDefault()
);

document.addEventListener(
    "gesturechange",
    event =>
        event.preventDefault()
);

document.addEventListener(
    "gestureend",
    event =>
        event.preventDefault()
);

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();

        if (
            now -
            lastTouchEnd <=
            300
        ) {

            event.preventDefault();

        }

        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);

/* =========================
   START
========================= */

initializeData();
