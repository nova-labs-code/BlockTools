<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Minecraft Time Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #090b10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        body {
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .toggle {
            display: flex;
            width: 100%;
            margin-bottom: 18px;
            padding: 4px;
            background: #151922;
            border-radius: 10px;
        }

        .toggle button {
            flex: 1;
            border: 0;
            padding: 12px;
            border-radius: 7px;
            background: transparent;
            color: #9ca3af;
            font-size: 15px;
            cursor: pointer;
        }

        .toggle button.active {
            background: #252b38;
            color: #ffffff;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .input-wrap {
            flex: 1;
        }

        .unit-wrap {
            width: 135px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aeb6c4;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            outline: none;
            background: #11151d;
            color: #ffffff;
            font-size: 16px;
            touch-action: manipulation;
        }

        input:focus {
            border-color: #566176;
        }

        .custom-dropdown {
            position: relative;
        }

        .dropdown-button {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            background: #11151d;
            color: #ffffff;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-button::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 21px;
            width: 7px;
            height: 7px;
            border-right: 2px solid #9ca3af;
            border-bottom: 2px solid #9ca3af;
            transform: rotate(45deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            z-index: 20;
            left: 0;
            right: 0;
            top: 56px;
            padding: 5px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            background: #11151d;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .dropdown-menu.open {
            display: block;
        }

        .dropdown-option {
            width: 100%;
            padding: 11px 10px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #ffffff;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-option:hover,
        .dropdown-option.selected {
            background: #252b38;
        }

        .sleep-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding: 13px 14px;
            border: 1px solid #202632;
            border-radius: 9px;
            background: #11151d;
        }

        .sleep-row.hidden {
            display: none;
        }

        .sleep-text {
            color: #ffffff;
            font-size: 15px;
        }

        .sleep-description {
            margin-top: 4px;
            color: #8f98a8;
            font-size: 12px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
        }

        .switch input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: #252b38;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #ffffff;
            transition: transform 0.15s ease;
        }

        .switch input:checked + .slider {
            background: #566176;
        }

        .switch input:checked + .slider::before {
            transform: translateX(20px);
        }

        .result {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid #202632;
            border-radius: 10px;
            background: #11151d;
        }

        .result-label {
            margin-bottom: 7px;
            color: #8f98a8;
            font-size: 13px;
        }

        .result-value {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
        }

        @media (max-width: 400px) {
            .row {
                flex-direction: column;
            }

            .unit-wrap {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Minecraft Time Calculator</h1>

    <div class="toggle">

        <button
            id="minecraftButton"
            class="active"
        >
            Minecraft Time
        </button>

        <button id="realButton">
            Real Time
        </button>

    </div>

    <div class="row">

        <div class="input-wrap">

            <label for="timeInput">
                Amount
            </label>

            <input
                id="timeInput"
                type="number"
                min="0"
                step="any"
                inputmode="decimal"
                placeholder="Enter a value"
            >

        </div>

        <div class="unit-wrap">

            <label>
                Unit
            </label>

            <div class="custom-dropdown">

                <button
                    type="button"
                    class="dropdown-button"
                    id="dropdownButton"
                >
                    Days
                </button>

                <div
                    class="dropdown-menu"
                    id="dropdownMenu"
                >

                    <button
                        type="button"
                        class="dropdown-option"
                        data-value="minutes"
                    >
                        Minutes
                    </button>

                    <button
                        type="button"
                        class="dropdown-option"
                        data-value="hours"
                    >
                        Hours
                    </button>

                    <button
                        type="button"
                        class="dropdown-option selected"
                        data-value="days"
                    >
                        Days
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div
        class="sleep-row"
        id="sleepRow"
    >

        <div>

            <div class="sleep-text">
                Sleep at night
            </div>

            <div class="sleep-description">
                Skip nighttime and add the sleep buffer
            </div>

        </div>

        <label class="switch">

            <input
                type="checkbox"
                id="sleepToggle"
            >

            <span class="slider"></span>

        </label>

    </div>

    <div class="result">

        <div
            class="result-label"
            id="resultLabel"
        >
            Real-world time
        </div>

        <div
            class="result-value"
            id="result"
        >
            —
        </div>

    </div>

</div>

<script>
    const minecraftButton =
        document.getElementById("minecraftButton");

    const realButton =
        document.getElementById("realButton");

    const timeInput =
        document.getElementById("timeInput");

    const dropdownButton =
        document.getElementById("dropdownButton");

    const dropdownMenu =
        document.getElementById("dropdownMenu");

    const sleepRow =
        document.getElementById("sleepRow");

    const sleepToggle =
        document.getElementById("sleepToggle");

    const resultLabel =
        document.getElementById("resultLabel");

    const result =
        document.getElementById("result");

    const options =
        document.querySelectorAll(".dropdown-option");

    let mode = "minecraft";
    let unit = "days";

    dropdownButton.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            dropdownMenu.classList.toggle("open");

        }
    );

    options.forEach(
        function (option) {

            option.addEventListener(
                "click",
                function () {

                    unit =
                        option.dataset.value;

                    dropdownButton.textContent =
                        option.textContent;

                    options.forEach(
                        function (item) {

                            item.classList.remove(
                                "selected"
                            );

                        }
                    );

                    option.classList.add(
                        "selected"
                    );

                    dropdownMenu.classList.remove(
                        "open"
                    );

                    update();

                }
            );

        }
    );

    document.addEventListener(
        "click",
        function () {

            dropdownMenu.classList.remove(
                "open"
            );

        }
    );

    minecraftButton.addEventListener(
        "click",
        function () {

            mode = "minecraft";

            minecraftButton.classList.add(
                "active"
            );

            realButton.classList.remove(
                "active"
            );

            resultLabel.textContent =
                "Real-world time";

            sleepRow.classList.remove(
                "hidden"
            );

            update();

        }
    );

    realButton.addEventListener(
        "click",
        function () {

            mode = "real";

            realButton.classList.add(
                "active"
            );

            minecraftButton.classList.remove(
                "active"
            );

            resultLabel.textContent =
                "Minecraft time";

            sleepRow.classList.add(
                "hidden"
            );

            update();

        }
    );

    sleepToggle.addEventListener(
        "change",
        update
    );

    timeInput.addEventListener(
        "input",
        update
    );

    function getMinutes(value) {

        if (unit === "minutes") {
            return value;
        }

        if (unit === "hours") {
            return value * 60;
        }

        if (unit === "days") {
            return value * 1440;
        }

        return 0;
    }

    function formatNumber(value) {

        if (Number.isInteger(value)) {
            return value.toLocaleString();
        }

        return value.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 2
            }
        );
    }

    function formatRealTime(minutes) {

        const totalSeconds =
            Math.round(minutes * 60);

        let remaining =
            totalSeconds;

        const years =
            Math.floor(
                remaining /
                (365 * 24 * 60 * 60)
            );

        remaining -=
            years *
            365 *
            24 *
            60 *
            60;

        const days =
            Math.floor(
                remaining /
                (24 * 60 * 60)
            );

        remaining -=
            days *
            24 *
            60 *
            60;

        const hours =
            Math.floor(
                remaining /
                (60 * 60)
            );

        remaining -=
            hours *
            60 *
            60;

        const mins =
            Math.floor(
                remaining / 60
            );

        remaining -=
            mins * 60;

        const seconds =
            remaining;

        const parts = [];

        if (years > 0) {
            parts.push(
                formatNumber(years) +
                " year" +
                (years === 1 ? "" : "s")
            );
        }

        if (days > 0) {
            parts.push(
                formatNumber(days) +
                " day" +
                (days === 1 ? "" : "s")
            );
        }

        if (hours > 0) {
            parts.push(
                formatNumber(hours) +
                " hour" +
                (hours === 1 ? "" : "s")
            );
        }

        if (mins > 0) {
            parts.push(
                formatNumber(mins) +
                " minute" +
                (mins === 1 ? "" : "s")
            );
        }

        if (
            seconds > 0 ||
            parts.length === 0
        ) {
            parts.push(
                formatNumber(seconds) +
                " second" +
                (seconds === 1 ? "" : "s")
            );
        }

        return parts.join(", ");
    }

    function formatMinecraftTime(minutes) {

        const totalMinutes =
            Math.round(minutes);

        let remaining =
            totalMinutes;

        const years =
            Math.floor(
                remaining /
                (365 * 24 * 60)
            );

        remaining -=
            years *
            365 *
            24 *
            60;

        const days =
            Math.floor(
                remaining /
                (24 * 60)
            );

        remaining -=
            days *
            24 *
            60;

        const hours =
            Math.floor(
                remaining / 60
            );

        remaining -=
            hours * 60;

        const mins =
            remaining;

        const parts = [];

        if (years > 0) {
            parts.push(
                formatNumber(years) +
                " Minecraft year" +
                (years === 1 ? "" : "s")
            );
        }

        if (days > 0) {
            parts.push(
                formatNumber(days) +
                " Minecraft day" +
                (days === 1 ? "" : "s")
            );
        }

        if (hours > 0) {
            parts.push(
                formatNumber(hours) +
                " Minecraft hour" +
                (hours === 1 ? "" : "s")
            );
        }

        if (
            mins > 0 ||
            parts.length === 0
        ) {
            parts.push(
                formatNumber(mins) +
                " Minecraft minute" +
                (mins === 1 ? "" : "s")
            );
        }

        return parts.join(", ");
    }

    function update() {

        const value =
            Number(timeInput.value);

        if (
            !Number.isFinite(value) ||
            value < 0
        ) {
            result.textContent = "—";
            return;
        }

        const minutes =
            getMinutes(value);

        if (mode === "minecraft") {

            let realMinutes =
                minutes / 72;

            if (sleepToggle.checked) {

                /*
                    A full Minecraft day is
                    20 real-world minutes.

                    The nighttime portion is
                    10 real-world minutes.

                    Sleeping skips that 10-minute
                    nighttime period.

                    Then 2 real-world minutes are
                    added for getting to bed and
                    the gameplay buffer.

                    This applies once for each
                    complete Minecraft day.
                */

                const sleepCount =
                    Math.floor(
                        minutes / 1440
                    );

                realMinutes -=
                    sleepCount * 10;

                realMinutes +=
                    sleepCount * 2;
            }

            if (realMinutes < 0) {
                realMinutes = 0;
            }

            resultLabel.textContent =
                "Real-world time";

            result.textContent =
                formatRealTime(
                    realMinutes
                );

        } else {

            const minecraftMinutes =
                minutes * 72;

            resultLabel.textContent =
                "Minecraft time";

            result.textContent =
                formatMinecraftTime(
                    minecraftMinutes
                );
        }
    }
</script>

<script>
    document.addEventListener(
        "touchstart",
        function (event) {

            if (event.touches.length > 1) {
                event.preventDefault();
            }

        },
        { passive: false }
    );

    document.addEventListener(
        "gesturestart",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        "gesturechange",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        "gestureend",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    let lastTouchEnd = 0;

    document.addEventListener(
        "touchend",
        function (event) {

            const now =
                Date.now();

            if (
                now - lastTouchEnd <= 300
            ) {
                event.preventDefault();
            }

            lastTouchEnd = now;

        },
        { passive: false }
    );

    document.addEventListener(
        "wheel",
        function (event) {

            if (event.ctrlKey) {
                event.preventDefault();
            }

        },
        { passive: false }
    );
</script>

</body>
</html>
