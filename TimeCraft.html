<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Minecraft Time Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #090b10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        body {
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .toggle {
            display: flex;
            width: 100%;
            margin-bottom: 18px;
            padding: 4px;
            background: #151922;
            border-radius: 10px;
        }

        .toggle button {
            flex: 1;
            border: 0;
            padding: 12px;
            border-radius: 7px;
            background: transparent;
            color: #9ca3af;
            font-size: 15px;
            cursor: pointer;
        }

        .toggle button.active {
            background: #252b38;
            color: #ffffff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aeb6c4;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            outline: none;
            background: #11151d;
            color: #ffffff;
            font-size: 17px;
            touch-action: manipulation;
        }

        input:focus {
            border-color: #566176;
        }

        .result {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid #202632;
            border-radius: 10px;
            background: #11151d;
        }

        .result-label {
            margin-bottom: 7px;
            color: #8f98a8;
            font-size: 13px;
        }

        .result-value {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.35;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Minecraft Time Calculator</h1>

    <div class="toggle">
        <button id="minecraftButton" class="active">
            Minecraft Time
        </button>

        <button id="realButton">
            Real Time
        </button>
    </div>

    <label id="inputLabel" for="timeInput">
        Minecraft time
    </label>

    <input
        id="timeInput"
        type="number"
        min="0"
        step="any"
        inputmode="decimal"
        placeholder="Enter a value"
    >

    <div class="result">
        <div class="result-label" id="resultLabel">
            Real-world time
        </div>

        <div class="result-value" id="result">
            —
        </div>
    </div>

</div>

<script>
    const minecraftButton = document.getElementById("minecraftButton");
    const realButton = document.getElementById("realButton");
    const inputLabel = document.getElementById("inputLabel");
    const resultLabel = document.getElementById("resultLabel");
    const timeInput = document.getElementById("timeInput");
    const result = document.getElementById("result");

    let mode = "minecraft";

    function formatNumber(value) {
        if (Number.isInteger(value)) {
            return value.toLocaleString();
        }

        return value.toLocaleString(undefined, {
            maximumFractionDigits: 2
        });
    }

    function formatRealTime(minutes) {
        const totalSeconds = minutes * 60;

        if (totalSeconds < 60) {
            return formatNumber(totalSeconds) + " seconds";
        }

        const totalHours = minutes / 60;

        if (totalHours < 24) {
            return formatNumber(totalHours) + " hours";
        }

        const totalDays = totalHours / 24;

        if (totalDays < 7) {
            return formatNumber(totalDays) + " days";
        }

        const weeks = totalDays / 7;

        if (weeks < 52) {
            return formatNumber(weeks) + " weeks";
        }

        const years = totalDays / 365;

        return formatNumber(years) + " years";
    }

    function formatMinecraftTime(days) {
        if (days < 1 / 24) {
            const minutes = days * 24 * 60;
            return formatNumber(minutes) + " Minecraft minutes";
        }

        if (days < 1) {
            const hours = days * 24;
            return formatNumber(hours) + " Minecraft hours";
        }

        if (days < 7) {
            return formatNumber(days) + " Minecraft days";
        }

        const weeks = days / 7;

        if (weeks < 52) {
            return formatNumber(weeks) + " Minecraft weeks";
        }

        const years = days / 365;

        return formatNumber(years) + " Minecraft years";
    }

    function update() {
        const value = Number(timeInput.value);

        if (!Number.isFinite(value) || value < 0) {
            result.textContent = "—";
            return;
        }

        if (mode === "minecraft") {
            resultLabel.textContent = "Real-world time";

            const realMinutes = value * 20;

            result.textContent = formatRealTime(realMinutes);
        } else {
            resultLabel.textContent = "Minecraft time";

            const minecraftDays = value / 20;

            result.textContent = formatMinecraftTime(minecraftDays);
        }
    }

    function setMode(newMode) {
        mode = newMode;

        minecraftButton.classList.toggle(
            "active",
            mode === "minecraft"
        );

        realButton.classList.toggle(
            "active",
            mode === "real"
        );

        if (mode === "minecraft") {
            inputLabel.textContent = "Minecraft time";
        } else {
            inputLabel.textContent = "Real-world time";
        }

        update();
    }

    minecraftButton.addEventListener("click", function () {
        setMode("minecraft");
    });

    realButton.addEventListener("click", function () {
        setMode("real");
    });

    timeInput.addEventListener("input", update);
</script>

<script>
    document.addEventListener("touchstart", function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
    }, { passive: false });

    document.addEventListener("gestureend", function (event) {
        event.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;

    document.addEventListener("touchend", function (event) {
        const now = Date.now();

        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }

        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener("wheel", function (event) {
        if (event.ctrlKey) {
            event.preventDefault();
        }
    }, { passive: false });
</script>

</body>
</html>
