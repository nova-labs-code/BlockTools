<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Minecraft Time Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #090b10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        body {
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .toggle {
            display: flex;
            width: 100%;
            margin-bottom: 18px;
            padding: 4px;
            background: #151922;
            border-radius: 10px;
        }

        .toggle button {
            flex: 1;
            border: 0;
            padding: 12px;
            border-radius: 7px;
            background: transparent;
            color: #9ca3af;
            font-size: 15px;
            cursor: pointer;
        }

        .toggle button.active {
            background: #252b38;
            color: #ffffff;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .input-wrap {
            flex: 1;
        }

        .unit-wrap {
            width: 135px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aeb6c4;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            outline: none;
            background: #11151d;
            color: #ffffff;
            font-size: 16px;
            touch-action: manipulation;
        }

        input:focus {
            border-color: #566176;
        }

        .custom-dropdown {
            position: relative;
        }

        .dropdown-button {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            background: #11151d;
            color: #ffffff;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-button::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 21px;
            width: 7px;
            height: 7px;
            border-right: 2px solid #9ca3af;
            border-bottom: 2px solid #9ca3af;
            transform: rotate(45deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            z-index: 20;
            left: 0;
            right: 0;
            top: 56px;
            padding: 5px;
            border: 1px solid #2b3240;
            border-radius: 9px;
            background: #11151d;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .dropdown-menu.open {
            display: block;
        }

        .dropdown-option {
            width: 100%;
            padding: 11px 10px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #ffffff;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-option:hover,
        .dropdown-option.selected {
            background: #252b38;
        }

        .result {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid #202632;
            border-radius: 10px;
            background: #11151d;
        }

        .result-label {
            margin-bottom: 7px;
            color: #8f98a8;
            font-size: 13px;
        }

        .result-value {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.35;
            word-break: break-word;
        }

        @media (max-width: 400px) {
            .row {
                flex-direction: column;
            }

            .unit-wrap {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>TimeCraft</h1>

    <div class="toggle">
        <button id="minecraftButton" class="active">
            Minecraft Time
        </button>

        <button id="realButton">
            Real Time
        </button>
    </div>

    <div class="row">

        <div class="input-wrap">
            <label for="timeInput">Amount</label>

            <input
                id="timeInput"
                type="number"
                min="0"
                step="any"
                inputmode="decimal"
                placeholder="Enter a value"
            >
        </div>

        <div class="unit-wrap">

            <label>Unit</label>

            <div class="custom-dropdown">

                <button
                    type="button"
                    class="dropdown-button"
                    id="dropdownButton"
                >
                    Days
                </button>

                <div
                    class="dropdown-menu"
                    id="dropdownMenu"
                >
                    <button
                        type="button"
                        class="dropdown-option"
                        data-value="minutes"
                    >
                        Minutes
                    </button>

                    <button
                        type="button"
                        class="dropdown-option"
                        data-value="hours"
                    >
                        Hours
                    </button>

                    <button
                        type="button"
                        class="dropdown-option selected"
                        data-value="days"
                    >
                        Days
                    </button>

                    <button
                        type="button"
                        class="dropdown-option"
                        data-value="years"
                    >
                        Years
                    </button>
                </div>

            </div>

        </div>

    </div>

    <div class="result">

        <div
            class="result-label"
            id="resultLabel"
        >
            Real-world time
        </div>

        <div
            class="result-value"
            id="result"
        >
            —
        </div>

    </div>

</div>

<script>
    const minecraftButton =
        document.getElementById("minecraftButton");

    const realButton =
        document.getElementById("realButton");

    const timeInput =
        document.getElementById("timeInput");

    const dropdownButton =
        document.getElementById("dropdownButton");

    const dropdownMenu =
        document.getElementById("dropdownMenu");

    const resultLabel =
        document.getElementById("resultLabel");

    const result =
        document.getElementById("result");

    const options =
        document.querySelectorAll(".dropdown-option");

    let mode = "minecraft";
    let unit = "days";

    dropdownButton.addEventListener("click", function (event) {
        event.stopPropagation();

        dropdownMenu.classList.toggle("open");
    });

    options.forEach(function (option) {

        option.addEventListener("click", function () {

            unit = option.dataset.value;

            dropdownButton.textContent =
                option.textContent;

            options.forEach(function (item) {
                item.classList.remove("selected");
            });

            option.classList.add("selected");

            dropdownMenu.classList.remove("open");

            update();
        });

    });

    document.addEventListener("click", function () {
        dropdownMenu.classList.remove("open");
    });

    minecraftButton.addEventListener("click", function () {
        mode = "minecraft";

        minecraftButton.classList.add("active");
        realButton.classList.remove("active");

        update();
    });

    realButton.addEventListener("click", function () {
        mode = "real";

        realButton.classList.add("active");
        minecraftButton.classList.remove("active");

        update();
    });

    timeInput.addEventListener("input", update);

    function formatNumber(value) {
        if (Number.isInteger(value)) {
            return value.toLocaleString();
        }

        return value.toLocaleString(undefined, {
            maximumFractionDigits: 2
        });
    }

    function getMinutes(value) {

        if (unit === "minutes") {
            return value;
        }

        if (unit === "hours") {
            return value * 60;
        }

        if (unit === "days") {
            return value * 1440;
        }

        if (unit === "years") {
            return value * 365 * 1440;
        }

        return 0;
    }

    function formatRealTime(minutes) {

        if (minutes < 1) {
            return formatNumber(minutes * 60) +
                " seconds";
        }

        if (minutes < 60) {
            return formatNumber(minutes) +
                " minutes";
        }

        const hours = minutes / 60;

        if (hours < 24) {
            return formatNumber(hours) +
                " hours";
        }

        const days = hours / 24;

        if (days < 365) {
            return formatNumber(days) +
                " days";
        }

        const years = days / 365;

        return formatNumber(years) +
            " years";
    }

    function formatMinecraftTime(minutes) {

        if (minutes < 60) {
            return formatNumber(minutes) +
                " Minecraft minutes";
        }

        const hours = minutes / 60;

        if (hours < 24) {
            return formatNumber(hours) +
                " Minecraft hours";
        }

        const days = hours / 24;

        if (days < 365) {
            return formatNumber(days) +
                " Minecraft days";
        }

        const years = days / 365;

        return formatNumber(years) +
            " Minecraft years";
    }

    function update() {

        const value = Number(timeInput.value);

        if (!Number.isFinite(value) || value < 0) {
            result.textContent = "—";
            return;
        }

        const minutes = getMinutes(value);

        if (mode === "minecraft") {

            /*
                1 Minecraft day = 20 real minutes.
                1 Minecraft minute = 20 / 1440 real minutes.
            */

            const realMinutes =
                minutes / 72;

            resultLabel.textContent =
                "Real-world time";

            result.textContent =
                formatRealTime(realMinutes);

        } else {

            /*
                1 real minute = 72 Minecraft minutes.
            */

            const minecraftMinutes =
                minutes * 72;

            resultLabel.textContent =
                "Minecraft time";

            result.textContent =
                formatMinecraftTime(minecraftMinutes);
        }
    }
</script>

<script>
    document.addEventListener(
        "touchstart",
        function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        },
        { passive: false }
    );

    document.addEventListener(
        "gesturestart",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        "gesturechange",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        "gestureend",
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );

    let lastTouchEnd = 0;

    document.addEventListener(
        "touchend",
        function (event) {

            const now = Date.now();

            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }

            lastTouchEnd = now;
        },
        { passive: false }
    );

    document.addEventListener(
        "wheel",
        function (event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        },
        { passive: false }
    );
</script>

</body>
</html>
