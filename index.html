    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>BlockTools</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #c8f0ff, #eef2f6);
    padding: 20px;
    color: #222;
    min-height: 100vh;

    touch-action: manipulation;
}

h1 {
    text-align: center;
    color: #1f6feb;
    text-shadow: 1px 1px 3px #ccc;
    margin-bottom: 40px;
}

/* --- TOOL GRID --- */

.tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1000px;
    margin: 0 auto 40px;
}

/* --- TOOL CARD --- */

.tool-card {
    background: linear-gradient(135deg, #fff, #f0f8ff);
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    opacity: 0;
    transform: translateY(10px);

    animation: fadeIn 0.5s forwards;

    transition: all 0.3s;
}

.tool-card:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
    background: linear-gradient(135deg, #f0f8ff, #ffffff);
}

.tool-card h3 {
    margin-bottom: 10px;
    color: #1f6feb;
}

.tool-card p {
    font-size: 15px;
    line-height: 1.5;
    color: #444;
    margin-bottom: 18px;
    flex: 1;
}

.tool-card a {
    display: inline-block;
    padding: 10px 20px;

    background: #1f6feb;
    color: #fff;

    text-decoration: none;
    font-weight: 700;

    border-radius: 8px;

    transition: all 0.2s;
}

.tool-card a:hover {
    background: #155ac4;
}

.tool-card a:active {
    transform: translateY(1px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
}

/* --- CATEGORY --- */

.category {
    max-width: 1000px;
    margin: 0 auto 35px;
}

.category-title {
    color: #222;
    font-size: 24px;
    margin-bottom: 15px;
    padding-left: 5px;
}

.category .tool-grid {
    margin-bottom: 0;
}

/* --- FOOTER --- */

footer {
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    color: #666;
}

/* --- ANIMATION --- */

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* --- MOBILE --- */

@media (max-width: 768px) {
    .tool-grid {
        grid-template-columns: repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

        gap: 20px;
    }

    body {
        padding: 15px;
    }

    .tool-card {
        padding: 18px;
    }

    .tool-card p {
        font-size: 16px;
    }

    .tool-card a {
        padding: 12px 25px;
        font-size: 16px;
    }
}

@media (max-width: 500px) {
    .tool-grid {
        grid-template-columns: 1fr;
        gap: 15px;
    }
}
</style>
</head>

<body>

<h1>BlockTools</h1>

<div id="categories"></div>

<footer>
    &copy; 2026 BlockTools. All rights reserved.
</footer>

<script>

/*
    =====================================================
    TOOL LIST
    =====================================================

    linking:

    "auto"
        Automatically checks the linked HTML page for
        its category.

    "manual"
        Uses the category written here.

    Example:

    {
        name: "BlockCalc",
        description: "What the tool does.",
        link: "BlockCalc.html",
        linking: "manual",
        category: "Tools"
    }

    For automatic linking:

    {
        name: "How To Play",
        description: "Learn how to play Minecraft.",
        link: "HowToPlay.html",
        linking: "auto"
    }

    The linked HTML page can contain:

    <meta name="blocktools-category" content="Guides">

*/

const tools = [

    {
        name: "BlockCalc",
        description:
            "Quickly calculate how many blocks you need for any area, radius, or build in Minecraft.",
        link: "BlockCalc.html",
        linking: "manual",
        category: "Tools"
    },

    {
        name: "Stacker",
        description:
            "Convert items into stacks, shulker boxes, and chests with multipliers for better planning.",
        link: "Stacker.html",
        linking: "manual",
        category: "Tools"
    },

    {
        name: "TimeCraft",
        description:
            "Convert between real-world time and Minecraft time, including Minecraft clocks and ticks.",
        link: "TimeCraft.html",
        linking: "manual",
        category: "Tools"
    },

    {
        name: "Coordly",
        description:
            "Save Minecraft locations and see their distance, direction, coordinates, and navigation information.",
        link: "Coordly.html",
        linking: "manual",
        category: "Tools"
    },

    {
        name: "How To Play",
        description:
            "Learn the basics of Minecraft and how to get started.",
        link: "HowToPlay.html",
        linking: "auto"
    }

];


/*
    =====================================================
    FETCH CATEGORY FROM HTML
    =====================================================
*/

async function getCategory(tool) {

    /*
        Manual category
    */

    if (tool.linking === "manual") {
        return tool.category || "Other";
    }


    /*
        Automatic category
    */

    if (tool.linking === "auto") {

        try {

            const response = await fetch(tool.link);

            if (!response.ok) {
                throw new Error("Page could not be loaded.");
            }

            const html = await response.text();

            const parser = new DOMParser();

            const page = parser.parseFromString(
                html,
                "text/html"
            );


            /*
                Look for:

                <meta
                    name="blocktools-category"
                    content="Guides"
                >
            */

            const categoryMeta = page.querySelector(
                'meta[name="blocktools-category"]'
            );


            if (categoryMeta) {

                const category =
                    categoryMeta.getAttribute("content");

                if (category && category.trim()) {
                    return category.trim();
                }

            }


            /*
                If no category exists,
                use Other.
            */

            return "Other";

        } catch (error) {

            console.error(
                "Could not determine category for:",
                tool.link,
                error
            );

            return "Other";
        }
    }


    return "Other";
}


/*
    =====================================================
    CREATE CARD
    =====================================================
*/

function createCard(tool, index) {

    const card = document.createElement("div");

    card.className = "tool-card";

    card.style.animationDelay =
        `${(index + 1) * 0.1}s`;


    const title = document.createElement("h3");

    title.textContent = tool.name;


    const description = document.createElement("p");

    description.textContent = tool.description;


    const link = document.createElement("a");

    link.href = tool.link;
    link.textContent = "Open";


    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(link);


    return card;
}


/*
    =====================================================
    BUILD CATEGORIES
    =====================================================
*/

async function buildCategories() {

    const categoriesContainer =
        document.getElementById("categories");


    /*
        Determine every tool's category first.
    */

    const categorizedTools =
        await Promise.all(

            tools.map(async tool => {

                const category =
                    await getCategory(tool);

                return {
                    ...tool,
                    resolvedCategory: category
                };

            })

        );


    /*
        Group tools by category.
    */

    const categories = {};


    categorizedTools.forEach(tool => {

        const category =
            tool.resolvedCategory;


        if (!categories[category]) {
            categories[category] = [];
        }


        categories[category].push(tool);

    });


    /*
        Create each category.
    */

    let animationIndex = 0;


    Object.keys(categories).forEach(categoryName => {

        const category =
            document.createElement("section");

        category.className = "category";


        const title =
            document.createElement("h2");

        title.className = "category-title";

        title.textContent = categoryName;


        const grid =
            document.createElement("div");

        grid.className = "tool-grid";


        categories[categoryName].forEach(tool => {

            const card =
                createCard(tool, animationIndex);

            grid.appendChild(card);

            animationIndex++;

        });


        category.appendChild(title);
        category.appendChild(grid);

        categoriesContainer.appendChild(category);

    });

}


/*
    =====================================================
    START
    =====================================================
*/

buildCategories();

</script>

</body>
</html>
